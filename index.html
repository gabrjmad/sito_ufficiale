<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scroll Sequence + Porta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">

  <style>
    :root {
      --loader-bg: #a9acb6;
      --loader-fg: #ffffff;
      --loader-out: 900ms;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
    }

    body.is-loading {
      overflow: hidden;
    }

    #scroll-space {}

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 900ms ease, transform 1200ms ease;
    }

    body.is-ready #stage {
      opacity: 1;
      transform: scale(1);
    }

    .seq-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .seq-layer.active {
      opacity: 1;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
      z-index: 2;
    }

    /* ───────────── PORTA SEMPLICE 3D ───────────── */
    #door-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      perspective: 1400px;           /* profondità camera */
      transform-style: preserve-3d;
      isolation: isolate;
    }

    #door-wrapper {
      position: relative;
      width: min(38vw, 520px);
      aspect-ratio: 3 / 5;           /* doppia porta verticale */
      transform-origin: center center;
      transform-style: preserve-3d;
      transform: translate3d(0, 40px, 0) scale(0.10); /* scala iniziale, zoom fino ~4x */
      will-change: transform;
    }

    .door-bg {
      position: absolute;
      inset: 0;
      background: #000;              /* dietro la porta per ora nero */
      z-index: 0;
    }

    .door-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform;
    }

    .door-panel-inner {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, #ffffff 0%, #f3f3f3 35%, #e4e4e4 60%, #fdfdfd 100%);
      border-radius: 6px;
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.9),
        inset 0 0 0 6px rgba(210,210,210,0.9),
        0 18px 45px rgba(0,0,0,0.55);
    }

    /* cornice pannelli interni */
    .door-panel-inner::before,
    .door-panel-inner::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      border-radius: 3px;
      border: 2px solid rgba(210,210,210,0.9);
      background: linear-gradient(135deg, #fbfbfb 0%, #efefef 40%, #ffffff 100%);
    }

    .door-panel-inner::before {
      top: 9%;
      height: 60%;
    }

    .door-panel-inner::after {
      bottom: 9%;
      height: 18%;
    }

    /* vetri fittizi: rettangoli più scuri (per ora "chiusi") */
    .door-glass-grid {
      position: absolute;
      inset: 12% 14% 26%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6%;
    }

    .door-glass-cell {
      border-radius: 2px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.28), rgba(0,0,0,0.18));
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.65),
        inset 0 0 0 2px rgba(190,190,190,0.8);
      opacity: 0.96;
    }

    /* pannello sinistro */
    .door-panel-left {
      left: 0;
      transform-origin: 0% 50%;      /* cardine a sinistra */
    }

    /* pannello destro */
    .door-panel-right {
      right: 0;
      transform-origin: 100% 50%;    /* cardine a destra */
    }

    /* maniglie semplici ma coerenti */
    .door-handle {
      position: absolute;
      top: 50%;
      width: 42px;
      height: 6px;
      margin-top: -3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #777, #e8e8e8, #888);
      box-shadow: 0 0 4px rgba(0,0,0,0.35);
    }

    .door-panel-left .door-handle {
      right: 14px;
    }

    .door-panel-right .door-handle {
      left: 14px;
    }

    .door-knob {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      margin-top: -6px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #b0b0b0 55%, #5c5c5c 100%);
      box-shadow: 0 0 4px rgba(0,0,0,0.35);
    }

    .door-panel-left .door-knob {
      right: 6px;
    }

    .door-panel-right .door-knob {
      left: 6px;
    }

    @media (max-aspect-ratio: 9/16) {
      #door-wrapper {
        width: min(58vw, 430px);
      }
    }

    @media (max-width: 768px) {
      #door-wrapper {
        width: min(60vw, 400px);
      }

      .loader-wrap {
        width: 64px;
        height: 64px;
      }

      .loader-segment {
        width: 12px;
        transform-origin: -18px center;
      }

      .loader-center {
        width: 8px;
        height: 8px;
      }
    }

    @media (max-width: 480px) {
      #door-wrapper {
        width: min(68vw, 340px);
      }
    }

    /* ───────────── PRELOADER ───────────── */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--loader-bg);
      opacity: 1;
      visibility: visible;
      transition:
        opacity var(--loader-out) ease,
        visibility var(--loader-out) ease;
    }

    #preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-wrap {
      position: relative;
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      transform: scale(0.88);
      animation: loaderAppear 900ms ease forwards;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      animation: rotateRing 2.8s linear infinite;
    }

    .loader-segment {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 2px;
      border-radius: 999px;
      background: var(--loader-fg);
      transform-origin: -22px center;
      opacity: 0.16;
      animation: pulseSeg 1.08s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .loader-center {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(255,255,255,0.20);
      animation: centerBreath 1.6s ease-in-out infinite;
    }

    .loader-segment:nth-child(1)  { transform: translate(-50%, -50%) rotate(0deg);   animation-delay: 0s; }
    .loader-segment:nth-child(2)  { transform: translate(-50%, -50%) rotate(30deg);  animation-delay: .08s; }
    .loader-segment:nth-child(3)  { transform: translate(-50%, -50%) rotate(60deg);  animation-delay: .16s; }
    .loader-segment:nth-child(4)  { transform: translate(-50%, -50%) rotate(90deg);  animation-delay: .24s; }
    .loader-segment:nth-child(5)  { transform: translate(-50%, -50%) rotate(120deg); animation-delay: .32s; }
    .loader-segment:nth-child(6)  { transform: translate(-50%, -50%) rotate(150deg); animation-delay: .40s; }
    .loader-segment:nth-child(7)  { transform: translate(-50%, -50%) rotate(180deg); animation-delay: .48s; }
    .loader-segment:nth-child(8)  { transform: translate(-50%, -50%) rotate(210deg); animation-delay: .56s; }
    .loader-segment:nth-child(9)  { transform: translate(-50%, -50%) rotate(240deg); animation-delay: .64s; }
    .loader-segment:nth-child(10) { transform: translate(-50%, -50%) rotate(270deg); animation-delay: .72s; }
    .loader-segment:nth-child(11) { transform: translate(-50%, -50%) rotate(300deg); animation-delay: .80s; }
    .loader-segment:nth-child(12) { transform: translate(-50%, -50%) rotate(330deg); animation-delay: .88s; }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes pulseSeg {
      0%, 100% {
        opacity: 0.12;
        filter: blur(0px);
      }
      50% {
        opacity: 1;
        filter: blur(0.2px);
      }
    }

    @keyframes centerBreath {
      0%, 100% {
        transform: scale(0.75);
        opacity: 0.6;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes loaderAppear {
      from {
        opacity: 0;
        transform: scale(0.72);
      }
      to {
        opacity: 1;
        transform: scale(0.88);
      }
    }
  </style>
</head>
<body class="is-loading">

<div id="preloader" aria-hidden="true">
  <div class="loader-wrap">
    <div class="loader-ring">
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
    </div>
    <div class="loader-center"></div>
  </div>
</div>

<div id="scroll-space"></div>

<div id="stage">
  <img id="seq-a" class="seq-layer active" alt="" decoding="async" fetchpriority="high">
  <img id="seq-b" class="seq-layer" alt="" decoding="async">
  <div id="fade-overlay"></div>

  <div id="door-scene">
    <div id="door-wrapper">
      <div class="door-bg"></div>

      <div class="door-panel door-panel-left">
        <div class="door-panel-inner">
          <div class="door-glass-grid">
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
          </div>
        </div>
        <div class="door-handle"></div>
        <div class="door-knob"></div>
      </div>

      <div class="door-panel door-panel-right">
        <div class="door-panel-inner">
          <div class="door-glass-grid">
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
            <div class="door-glass-cell"></div>
          </div>
        </div>
        <div class="door-handle"></div>
        <div class="door-knob"></div>
      </div>
    </div>
  </div>
</div>

<script>
  /* ───────────────── PRELOADER CONFIG ───────────────── */
  const MIN_LOADER_TIME = 1800;
  const MAX_LOADER_TIME = 7000;

  /* ───────────────── CONFIG ───────────────── */
  const FRAME_COUNT = 127;
  const PX_PER_FRAME = window.innerWidth <= 768 ? 30 : 24;
  const FADE_PX = 420;

  const DOOR_APPROACH_PX = 1500;
  const DOOR_ENTER_PX = 900;

  const S_SEQ_END  = (FRAME_COUNT - 1) * PX_PER_FRAME;
  const S_FADE_END = S_SEQ_END + FADE_PX;
  const S_OPEN_END = S_FADE_END + DOOR_APPROACH_PX;
  const S_TUNN_END = S_OPEN_END + DOOR_ENTER_PX;
  const TOTAL_PX   = S_TUNN_END;

  const frameSrc = i => `img-sequence/compressed_${String(i + 2).padStart(3, '0')}.jpg`;

  /* ───────────────── DOM ───────────────── */
  const body = document.body;
  const preloader = document.getElementById('preloader');
  const scrollSpace = document.getElementById('scroll-space');
  const layerA = document.getElementById('seq-a');
  const layerB = document.getElementById('seq-b');
  const overlay = document.getElementById('fade-overlay');
  const doorScene = document.getElementById('door-scene');
  const doorWrapper = document.getElementById('door-wrapper');
  const doorLeft = document.querySelector('.door-panel-left');
  const doorRight = document.querySelector('.door-panel-right');

  function setScrollHeight() {
    scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
  }
  setScrollHeight();

  /* ───────────────── HELPERS ───────────────── */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const norm = (v, a, b) => clamp((v - a) / (b - a), 0, 1);
  const ease = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

  function frameIndexFor(scrollY) {
    if (scrollY >= S_SEQ_END) return FRAME_COUNT - 1;
    const progress = clamp(scrollY / S_SEQ_END, 0, 1);
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  /* ───────────────── FRAME CACHE ───────────────── */
  const frames = Array.from({ length: FRAME_COUNT }, () => ({
    status: 0,
    img: null,
    promise: null
  }));

  let activeLayer = layerA;
  let hiddenLayer = layerB;
  let shownFrame = -1;
  let wantedFrame = 0;

  function swapTo(src) {
    if (hiddenLayer.src !== src) hiddenLayer.src = src;
    hiddenLayer.classList.add('active');
    activeLayer.classList.remove('active');

    const tmp = activeLayer;
    activeLayer = hiddenLayer;
    hiddenLayer = tmp;
  }

  function ensureFrame(index, priority = 'auto') {
    if (index < 0 || index >= FRAME_COUNT) return Promise.resolve(null);

    const item = frames[index];
    if (item.status === 2) return Promise.resolve(item.img);
    if (item.promise) return item.promise;

    item.status = 1;

    const img = new Image();
    img.decoding = 'async';
    img.fetchPriority = priority;
    img.src = frameSrc(index);

    item.promise = new Promise((resolve, reject) => {
      img.onload = async () => {
        try {
          if (img.decode) await img.decode();
        } catch (e) {}

        item.status = 2;
        item.img = img;
        resolve(img);
      };

      img.onerror = () => {
        item.status = 3;
        reject(new Error(`Frame non trovato: ${frameSrc(index)}`));
      };
    }).finally(() => {
      item.promise = null;
      if (wantedFrame === index && frames[index].status === 2) {
        startLoop();
      }
    });

    return item.promise;
  }

  function warmFrames(center) {
    ensureFrame(center, 'high');
    ensureFrame(center + 1, 'high');
    ensureFrame(center - 1, 'high');
    ensureFrame(center + 2, 'auto');
    ensureFrame(center - 2, 'auto');
    ensureFrame(center + 3, 'auto');
    ensureFrame(center - 3, 'auto');
    ensureFrame(center + 4, 'auto');
    ensureFrame(center - 4, 'auto');
  }

  function showFrame(index) {
    index = clamp(index, 0, FRAME_COUNT - 1);
    wantedFrame = index;
    warmFrames(index);

    const item = frames[index];
    if (item.status !== 2 || !item.img) return;
    if (shownFrame === index) return;

    shownFrame = index;
    swapTo(item.img.currentSrc || item.img.src);
  }

  function preloadInitial() {
    for (let i = 0; i < Math.min(18, FRAME_COUNT); i++) {
      ensureFrame(i, 'high').catch(() => {});
    }

    let cursor = 18;

    function pump() {
      let count = 0;

      while (cursor < FRAME_COUNT && count < 4) {
        ensureFrame(cursor, 'auto').catch(() => {});
        cursor++;
        count++;
      }

      if (cursor < FRAME_COUNT) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(pump, { timeout: 120 });
        } else {
          setTimeout(pump, 40);
        }
      }
    }

    setTimeout(pump, 80);
  }

  /* ───────────────── PRELOADER HELPERS ───────────────── */
  function waitForFonts() {
    if (!document.fonts || !document.fonts.ready) return Promise.resolve();
    return document.fonts.ready.catch(() => Promise.resolve());
  }

  function minDelay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function timeout(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function hidePreloader() {
    preloader.classList.add('is-hidden');
    body.classList.remove('is-loading');
    body.classList.add('is-ready');
  }

  /* ───────────────── PORTA: apertura+zoom coerente ───────────────── */
  function renderDoorSequence(scrollY) {
    if (scrollY < S_SEQ_END) {
      doorScene.style.opacity = '0';
      return;
    }

    const revealT = norm(scrollY, S_SEQ_END, S_FADE_END);
    doorScene.style.opacity = revealT.toFixed(3);

    const approachT = ease(norm(scrollY, S_FADE_END, S_OPEN_END));
    const openT = ease(norm(scrollY, S_FADE_END, S_OPEN_END));

    // scala da ~0.10 a ~4.0
    const scale = 0.10 + approachT * 3.90;
    const translateY = 40 - approachT * 40;

    doorWrapper.style.transform =
      `translate3d(0, ${translateY.toFixed(2)}px, 0) scale(${scale.toFixed(4)})`;

    // ante tra 0° e ~100° (fra 90 e 110)
    const swing = 100 * openT;

    doorLeft.style.transform =
      `perspective(1400px) rotateY(${(-swing).toFixed(2)}deg)`;
    doorRight.style.transform =
      `perspective(1400px) rotateY(${swing.toFixed(2)}deg)`;
  }

  /* ───────────────── SMOOTH RENDER LOOP ───────────────── */
  let targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  let currentScrollY = targetScrollY;
  let running = false;

  function render(scrollY) {
    const frameIdx = frameIndexFor(scrollY);
    showFrame(frameIdx);

    const fadeT = norm(scrollY, S_SEQ_END, S_FADE_END);
    overlay.style.opacity = fadeT.toFixed(3);

    renderDoorSequence(scrollY);
  }

  function loop() {
    const delta = targetScrollY - currentScrollY;

    if (Math.abs(delta) > 0.15) {
      currentScrollY += delta * 0.22;
    } else {
      currentScrollY = targetScrollY;
    }

    render(currentScrollY);

    const stillMoving = Math.abs(targetScrollY - currentScrollY) > 0.15;
    const waitingForFrame = frames[wantedFrame]?.status !== 2;

    if (stillMoving || waitingForFrame) {
      requestAnimationFrame(loop);
    } else {
      running = false;
      render(targetScrollY);
    }
  }

  function startLoop() {
    if (running) return;
    running = true;
    requestAnimationFrame(loop);
  }

  /* ───────────────── EVENTS ───────────────── */
  window.addEventListener('scroll', () => {
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    startLoop();
  }, { passive: true });

  window.addEventListener('resize', () => {
    setScrollHeight();
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    currentScrollY = targetScrollY;
    startLoop();
  }, { passive: true });

  /* ───────────────── INIT ───────────────── */
  async function init() {
    preloadInitial();

    const firstFramePromise = ensureFrame(0, 'high')
      .then(img => {
        layerA.src = img.currentSrc || img.src;
        shownFrame = 0;
        wantedFrame = 0;
        render(currentScrollY);
      })
      .catch(() => {
        render(currentScrollY);
      });

    await Promise.race([
      Promise.all([
        firstFramePromise,
        waitForFonts(),
        minDelay(MIN_LOADER_TIME)
      ]),
      timeout(MAX_LOADER_TIME)
    ]);

    hidePreloader();
    startLoop();
  }

  window.addEventListener('load', init, { once: true });
</script>

</body>
</html>
