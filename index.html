<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gabriele Madeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
    }

    #scroll-space {}

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    .seq-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      backface-visibility: hidden;
      transform: translateZ(0);
      z-index: 1;
    }

    .seq-layer.active {
      opacity: 1;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
      z-index: 5;
    }

    #starfield-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
      background: #000;
      opacity: 0;
      will-change: opacity, transform;
      transition: opacity 700ms ease;
    }

    #starfield-bg.is-visible {
      opacity: 1;
    }

    /* ═══════════════════════════════
       PRELOADER "GABRIELE"
    ═══════════════════════════════ */

    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #a9acb6;
      opacity: 1;
      visibility: visible;
      transition: opacity 900ms ease, visibility 900ms ease;
    }

    #preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-text-wrap {
      display: flex;
      gap: 0.45rem;
      font-family: "Playfair Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      letter-spacing: 0.22em;
      color: #111;
    }

    .loader-letter {
      position: relative;
      display: inline-block;
      text-transform: uppercase;
      color: #111111;
      text-shadow:
        0 0.04em 0 rgba(255,255,255,0.5),
        0 0.06em 0 rgba(0,0,0,0.24);
      animation: letterBounce 1.1s ease-in-out infinite;
    }

    .loader-letter:nth-child(1) { animation-delay: 0s;    }
    .loader-letter:nth-child(2) { animation-delay: 0.10s; }
    .loader-letter:nth-child(3) { animation-delay: 0.20s; }
    .loader-letter:nth-child(4) { animation-delay: 0.30s; }
    .loader-letter:nth-child(5) { animation-delay: 0.40s; }
    .loader-letter:nth-child(6) { animation-delay: 0.50s; }
    .loader-letter:nth-child(7) { animation-delay: 0.60s; }
    .loader-letter:nth-child(8) { animation-delay: 0.70s; }

    @keyframes letterBounce {
      0%   { transform: translateY(0)    scale(1);      opacity: 0.40; }
      25%  { transform: translateY(-8px) scale(1);      opacity: 1;    }
      50%  { transform: translateY(0)    scale(1);      opacity: 0.9;  }
      75%  { transform: translateY(3px)  scale(1.02);   opacity: 0.85; }
      100% { transform: translateY(0)    scale(1.04);   opacity: 1;    }
    }
  </style>
</head>
<body>

<div id="preloader" aria-hidden="true">
  <div class="loader-text-wrap">
    <span class="loader-letter">G</span>
    <span class="loader-letter">A</span>
    <span class="loader-letter">B</span>
    <span class="loader-letter">R</span>
    <span class="loader-letter">I</span>
    <span class="loader-letter">E</span>
    <span class="loader-letter">L</span>
    <span class="loader-letter">E</span>
  </div>
</div>

<div id="scroll-space"></div>

<div id="stage">
  <img id="seq-a" class="seq-layer active" alt="" decoding="async" fetchpriority="high">
  <img id="seq-b" class="seq-layer" alt="" decoding="async">
  <canvas id="starfield-bg" aria-hidden="true"></canvas>
  <div id="fade-overlay"></div>
</div>

<script>
  /* ───────────────── CONFIG ───────────────── */
  const FRAME_COUNT = 127;
  const PX_PER_FRAME = window.innerWidth <= 768 ? 30 : 24;
  const FADE_PX = 420;
  const STARFIELD_PX = window.innerWidth <= 768 ? 2400 : 3200;

  const S_SEQ_END  = (FRAME_COUNT - 1) * PX_PER_FRAME;
  const S_FADE_END = S_SEQ_END + FADE_PX;
  const S_STAR_END = S_FADE_END + STARFIELD_PX;
  const TOTAL_PX   = S_STAR_END;

  const frameSrc = i => `img-sequence/compressed_${String(i + 2).padStart(3, '0')}.jpg`;

  /* ───────────────── DOM ───────────────── */
  const scrollSpace = document.getElementById('scroll-space');
  const layerA = document.getElementById('seq-a');
  const layerB = document.getElementById('seq-b');
  const overlay = document.getElementById('fade-overlay');
  const preloader = document.getElementById('preloader');
  const starCanvas = document.getElementById('starfield-bg');
  const starCtx = starCanvas.getContext('2d', { alpha: false });

  function setScrollHeight() {
    scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
  }
  setScrollHeight();

  /* ───────────────── HELPERS ───────────────── */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const norm = (v, a, b) => clamp((v - a) / (b - a), 0, 1);
  const ease = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

  function frameIndexFor(scrollY) {
    if (scrollY >= S_SEQ_END) return FRAME_COUNT - 1;
    const progress = clamp(scrollY / S_SEQ_END, 0, 1);
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  /* ───────────────── FRAME CACHE ───────────────── */
  const frames = Array.from({ length: FRAME_COUNT }, () => ({
    status: 0,
    img: null,
    promise: null
  }));

  let activeLayer = layerA;
  let hiddenLayer = layerB;
  let shownFrame = -1;
  let wantedFrame = 0;

  function swapTo(src) {
    if (hiddenLayer.src !== src) hiddenLayer.src = src;
    hiddenLayer.classList.add('active');
    activeLayer.classList.remove('active');

    const tmp = activeLayer;
    activeLayer = hiddenLayer;
    hiddenLayer = tmp;
  }

  function ensureFrame(index, priority = 'auto') {
    if (index < 0 || index >= FRAME_COUNT) return Promise.resolve(null);

    const item = frames[index];
    if (item.status === 2) return Promise.resolve(item.img);
    if (item.promise) return item.promise;

    item.status = 1;

    const img = new Image();
    img.decoding = 'async';
    img.fetchPriority = priority;
    img.src = frameSrc(index);

    item.promise = new Promise((resolve, reject) => {
      img.onload = async () => {
        try {
          if (img.decode) await img.decode();
        } catch (e) {}
        item.status = 2;
        item.img = img;
        resolve(img);
      };

      img.onerror = () => {
        item.status = 3;
        reject(new Error(`Frame non trovato: ${frameSrc(index)}`));
      };
    }).finally(() => {
      item.promise = null;
      if (wantedFrame === index && frames[index].status === 2) {
        startLoop();
      }
    });

    return item.promise;
  }

  function warmFrames(center) {
    ensureFrame(center, 'high');
    ensureFrame(center + 1, 'high');
    ensureFrame(center - 1, 'high');
    ensureFrame(center + 2, 'auto');
    ensureFrame(center - 2, 'auto');
    ensureFrame(center + 3, 'auto');
    ensureFrame(center - 3, 'auto');
    ensureFrame(center + 4, 'auto');
    ensureFrame(center - 4, 'auto');
  }

  function showFrame(index) {
    index = clamp(index, 0, FRAME_COUNT - 1);
    wantedFrame = index;
    warmFrames(index);

    const item = frames[index];
    if (item.status !== 2 || !item.img) return;
    if (shownFrame === index) return;

    shownFrame = index;
    swapTo(item.img.currentSrc || item.img.src);
  }

  function preloadInitial() {
    for (let i = 0; i < Math.min(18, FRAME_COUNT); i++) {
      ensureFrame(i, 'high').catch(() => {});
    }

    let cursor = 18;
    function pump() {
      let count = 0;
      while (cursor < FRAME_COUNT && count < 4) {
        ensureFrame(cursor, 'auto').catch(() => {});
        cursor++;
        count++;
      }

      if (cursor < FRAME_COUNT) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(pump, { timeout: 120 });
        } else {
          setTimeout(pump, 40);
        }
      }
    }

    setTimeout(pump, 80);
  }

  /* ───────────────── STARFIELD ───────────────── */
  const starState = {
    width: 0,
    height: 0,
    dpr: 1,
    stars: [],
    targetX: 0,
    targetY: 0,
    currentX: 0,
    currentY: 0,
    baseCenterX: 0,
    baseCenterY: 0,
    driftX: 0,
    driftY: 0,
    time: 0,
    speed: 8.5,
    baseFov: 520,
    depth: 2600,
    visibleAmount: 0
  };

  function makeStar(randomZ = false) {
    const spreadX = starState.width * 2.4;
    const spreadY = starState.height * 2.4;

    return {
      x: (Math.random() - 0.5) * spreadX,
      y: (Math.random() - 0.5) * spreadY,
      z: randomZ ? Math.random() * starState.depth : starState.depth,
      size: Math.random() * 1.25 + 0.25,
      alpha: Math.random() * 0.65 + 0.25,
      twinkleSpeed: Math.random() * 0.03 + 0.008,
      twinkleOffset: Math.random() * Math.PI * 2
    };
  }

  function recycleStar(star) {
    const spreadX = starState.width * 2.4;
    const spreadY = starState.height * 2.4;

    star.x = (Math.random() - 0.5) * spreadX;
    star.y = (Math.random() - 0.5) * spreadY;
    star.z = starState.depth;
    star.size = Math.random() * 1.25 + 0.25;
    star.alpha = Math.random() * 0.65 + 0.25;
    star.twinkleSpeed = Math.random() * 0.03 + 0.008;
    star.twinkleOffset = Math.random() * Math.PI * 2;
  }

  function initStars() {
    starState.width = window.innerWidth;
    starState.height = window.innerHeight;
    starState.baseCenterX = starState.width * 0.5;
    starState.baseCenterY = starState.height * 0.5;
    starState.currentX = starState.baseCenterX;
    starState.currentY = starState.baseCenterY;
    starState.targetX = starState.baseCenterX;
    starState.targetY = starState.baseCenterY;
    starState.stars = [];

    const count = Math.max(320, Math.floor((starState.width * starState.height) / 4200));
    for (let i = 0; i < count; i++) {
      starState.stars.push(makeStar(true));
    }
  }

  function onPointerMove(clientX, clientY) {
    const nx = clientX / starState.width - 0.5;
    const ny = clientY / starState.height - 0.5;

    const followRangeX = starState.width * 0.09;
    const followRangeY = starState.height * 0.09;

    starState.targetX = starState.baseCenterX + nx * followRangeX;
    starState.targetY = starState.baseCenterY + ny * followRangeY;

    starState.driftX = nx * 26;
    starState.driftY = ny * 26;
  }

  function resizeStage() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    starState.dpr = dpr;

    starCanvas.width = Math.floor(window.innerWidth * dpr);
    starCanvas.height = Math.floor(window.innerHeight * dpr);
    starCanvas.style.width = window.innerWidth + 'px';
    starCanvas.style.height = window.innerHeight + 'px';

    starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    setScrollHeight();
    initStars();
  }

  function drawStars() {
    starState.time += 1;

    starState.currentX += (starState.targetX - starState.currentX) * 0.035;
    starState.currentY += (starState.targetY - starState.currentY) * 0.035;

    starCtx.fillStyle = "#000000";
    starCtx.fillRect(0, 0, starState.width, starState.height);

    if (starState.visibleAmount <= 0.001) {
      requestAnimationFrame(drawStars);
      return;
    }

    for (let i = 0; i < starState.stars.length; i++) {
      const s = starState.stars[i];

      const depthBoost = 1 + (1 - s.z / starState.depth) * 1.8;
      s.z -= starState.speed * depthBoost;

      if (s.z <= 1) {
        recycleStar(s);
        continue;
      }

      const persp = starState.baseFov / s.z;
      const parallaxFactor = 1.65 - s.z / starState.depth;

      const px = starState.currentX + (s.x + starState.driftX * parallaxFactor) * persp;
      const py = starState.currentY + (s.y + starState.driftY * parallaxFactor) * persp;

      const trailZ = s.z + 34;
      const trailPersp = starState.baseFov / trailZ;

      const tx = starState.currentX + (s.x + starState.driftX * parallaxFactor) * trailPersp;
      const ty = starState.currentY + (s.y + starState.driftY * parallaxFactor) * trailPersp;

      if (px < -160 || px > starState.width + 160 || py < -160 || py > starState.height + 160) {
        recycleStar(s);
        continue;
      }

      const proximity = 1 - s.z / starState.depth;
      const radius = Math.max(0.35, s.size + proximity * 2.2);
      const twinkle = 0.76 + Math.sin(starState.time * s.twinkleSpeed + s.twinkleOffset) * 0.24;
      const alpha = Math.min(1, (s.alpha + proximity * 0.45) * twinkle * starState.visibleAmount);

      starCtx.beginPath();
      starCtx.strokeStyle = `rgba(255,255,255,${alpha * 0.24})`;
      starCtx.lineWidth = Math.max(0.45, radius * 0.85);
      starCtx.moveTo(tx, ty);
      starCtx.lineTo(px, py);
      starCtx.stroke();

      const glow = starCtx.createRadialGradient(px, py, 0, px, py, radius * 4.5);
      glow.addColorStop(0, `rgba(255,255,255,${alpha})`);
      glow.addColorStop(0.35, `rgba(255,255,255,${alpha * 0.35})`);
      glow.addColorStop(1, `rgba(255,255,255,0)`);

      starCtx.beginPath();
      starCtx.fillStyle = glow;
      starCtx.arc(px, py, radius * 4.5, 0, Math.PI * 2);
      starCtx.fill();

      starCtx.beginPath();
      starCtx.fillStyle = `rgba(255,255,255,${Math.min(1, alpha * 1.08)})`;
      starCtx.arc(px, py, radius, 0, Math.PI * 2);
      starCtx.fill();
    }

    requestAnimationFrame(drawStars);
  }

  /* ───────────────── SMOOTH RENDER LOOP ───────────────── */
  let targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  let currentScrollY = targetScrollY;
  let running = false;

  function render(scrollY) {
    const frameIdx = frameIndexFor(scrollY);
    showFrame(frameIdx);

    const fadeT = norm(scrollY, S_SEQ_END, S_FADE_END);
    overlay.style.opacity = fadeT.toFixed(3);

    const starT = ease(norm(scrollY, S_FADE_END, S_FADE_END + 220));

    if (scrollY < S_FADE_END) {
      starCanvas.classList.remove('is-visible');
      starState.visibleAmount = 0;
      return;
    }

    starCanvas.classList.add('is-visible');
    starState.visibleAmount = starT;
  }

  function loop() {
    const delta = targetScrollY - currentScrollY;

    if (Math.abs(delta) > 0.15) {
      currentScrollY += delta * 0.22;
    } else {
      currentScrollY = targetScrollY;
    }

    render(currentScrollY);

    const stillMoving = Math.abs(targetScrollY - currentScrollY) > 0.15;
    const waitingForFrame = frames[wantedFrame]?.status !== 2;

    if (stillMoving || waitingForFrame) {
      requestAnimationFrame(loop);
    } else {
      running = false;
      render(targetScrollY);
    }
  }

  function startLoop() {
    if (running) return;
    running = true;
    requestAnimationFrame(loop);
  }

  /* ───────────────── EVENTS ───────────────── */
  window.addEventListener('scroll', () => {
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    startLoop();
  }, { passive: true });

  window.addEventListener('resize', () => {
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    currentScrollY = targetScrollY;
    resizeStage();
    startLoop();
  }, { passive: true });

  window.addEventListener('mousemove', e => {
    onPointerMove(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (!e.touches[0]) return;
    onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('mouseleave', () => {
    starState.targetX = starState.baseCenterX;
    starState.targetY = starState.baseCenterY;
    starState.driftX = 0;
    starState.driftY = 0;
  });

  /* ───────────────── INIT ───────────────── */
  preloadInitial();

  ensureFrame(0, 'high')
    .then(img => {
      layerA.src = img.currentSrc || img.src;
      shownFrame = 0;
      wantedFrame = 0;
      render(currentScrollY);
    })
    .catch(() => {
      render(currentScrollY);
    });

  window.addEventListener('load', () => {
    setTimeout(() => {
      preloader.classList.add('is-hidden');
    }, 1200);
  });

  resizeStage();
  requestAnimationFrame(drawStars);
</script>

</body>
</html>
