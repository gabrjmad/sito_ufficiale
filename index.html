<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gabriele Madeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
    }

    #scroll-space {}

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    .seq-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .seq-layer.active {
      opacity: 1;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }

    #door-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    #door-wrapper {
      position: relative;
      width: 360px;
      height: 520px;
      transform-origin: center center;
      transform: scale(0.1);
      will-change: transform;
    }

    #door-svg {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 2;
    }

    #door-tunnel {
      position: absolute;
      top: 16%;
      left: 23%;
      width: 54%;
      height: 64%;
      background: #6fb0e6;
      overflow: hidden;
      perspective: 900px;
      z-index: 1;
    }

    #tunnel-inner {
      position: absolute;
      inset: -60% -60%;
      transform-style: preserve-3d;
      transform-origin: center center;
      will-change: transform;
    }

    .tunnel-word {
      position: absolute;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      color: #f5f7ff;
      white-space: nowrap;
      line-height: 1;
      user-select: none;
      transform-origin: center center;
    }

    #door-left,
    #door-right {
      will-change: transform;
    }

    /* ═══════════════════════════════
       PRELOADER "GABRIELE"
    ═══════════════════════════════ */

    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #a9acb6;
      opacity: 1;
      visibility: visible;
      transition: opacity 900ms ease, visibility 900ms ease;
    }

    #preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-text-wrap {
      display: flex;
      gap: 0.45rem;
      font-family: "Playfair Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      letter-spacing: 0.22em;
      color: #111;
    }

    .loader-letter {
      position: relative;
      display: inline-block;
      text-transform: uppercase;
      color: #111111;
      text-shadow:
        0 0.04em 0 rgba(255,255,255,0.5),
        0 0.06em 0 rgba(0,0,0,0.24);
      animation: letterBounce 1.1s ease-in-out infinite;
    }

    .loader-letter:nth-child(1) { animation-delay: 0s;    }
    .loader-letter:nth-child(2) { animation-delay: 0.10s; }
    .loader-letter:nth-child(3) { animation-delay: 0.20s; }
    .loader-letter:nth-child(4) { animation-delay: 0.30s; }
    .loader-letter:nth-child(5) { animation-delay: 0.40s; }
    .loader-letter:nth-child(6) { animation-delay: 0.50s; }
    .loader-letter:nth-child(7) { animation-delay: 0.60s; }
    .loader-letter:nth-child(8) { animation-delay: 0.70s; }

    @keyframes letterBounce {
      0%   { transform: translateY(0)    scale(1);      opacity: 0.40; }
      25%  { transform: translateY(-8px) scale(1);      opacity: 1;    }
      50%  { transform: translateY(0)    scale(1);      opacity: 0.9;  }
      75%  { transform: translateY(3px)  scale(1.02);   opacity: 0.85; }
      100% { transform: translateY(0)    scale(1.04);   opacity: 1;    }
    }
  </style>
</head>
<body>

<!-- PRELOADER SOLO TESTO -->
<div id="preloader" aria-hidden="true">
  <div class="loader-text-wrap">
    <span class="loader-letter">G</span>
    <span class="loader-letter">A</span>
    <span class="loader-letter">B</span>
    <span class="loader-letter">R</span>
    <span class="loader-letter">I</span>
    <span class="loader-letter">E</span>
    <span class="loader-letter">L</span>
    <span class="loader-letter">E</span>
  </div>
</div>

<div id="scroll-space"></div>

<div id="stage">
  <img id="seq-a" class="seq-layer active" alt="" decoding="async" fetchpriority="high">
  <img id="seq-b" class="seq-layer" alt="" decoding="async">
  <div id="fade-overlay"></div>

  <div id="door-scene">
    <div id="door-wrapper">
      <div id="door-tunnel">
        <div id="tunnel-inner"></div>
      </div>

      <svg id="door-svg" viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="360" height="520" fill="#000" />
        <rect x="20" y="20" width="320" height="480" fill="#f5f5f5" />
        <rect x="36" y="36" width="288" height="448" fill="#e9e9e9" />
        <rect x="180" y="36" width="2" height="448" fill="#d0d0d0" />

        <g id="door-left" style="transform-origin: 36px 260px; transform-box: fill-box;">
          <rect x="36" y="36" width="144" height="448" fill="#fdfdfd" />
          <rect x="48" y="52" width="120" height="416" fill="#f2f2f2" />
          <rect x="56" y="60" width="104" height="400" fill="#fdfdfd" />
          <rect x="160" y="246" width="8" height="32" rx="4" fill="#d0d0d0" />
        </g>

        <g id="door-right" style="transform-origin: 324px 260px; transform-box: fill-box;">
          <rect x="196" y="36" width="144" height="448" fill="#fdfdfd" />
          <rect x="208" y="52" width="120" height="416" fill="#f2f2f2" />
          <rect x="216" y="60" width="104" height="400" fill="#fdfdfd" />
          <rect x="196" y="246" width="8" height="32" rx="4" fill="#d0d0d0" />
        </g>

        <rect x="20" y="20" width="320" height="480" fill="none" stroke="#d0d0d0" stroke-width="2" />
      </svg>
    </div>
  </div>
</div>

<script>
  /* ───────────────── CONFIG ───────────────── */
  const FRAME_COUNT = 127; // compressed_002.jpg → compressed_128.jpg
  const PX_PER_FRAME = window.innerWidth <= 768 ? 30 : 24;
  const FADE_PX = 420;
  const DOOR_ZOOM_PX = 1200;
  const DOOR_OPEN_PX = 600;
  const TUNNEL_PX = 900;

  const S_SEQ_END  = (FRAME_COUNT - 1) * PX_PER_FRAME; // ultimo frame = compressed_128.jpg
  const S_FADE_END = S_SEQ_END + FADE_PX;
  const S_ZOOM_END = S_FADE_END + DOOR_ZOOM_PX;
  const S_OPEN_END = S_ZOOM_END + DOOR_OPEN_PX;
  const S_TUNN_END = S_OPEN_END + TUNNEL_PX;
  const TOTAL_PX   = S_TUNN_END;

  const frameSrc = i => `img-sequence/compressed_${String(i + 2).padStart(3, '0')}.jpg`;

  /* ───────────────── DOM ───────────────── */
  const scrollSpace = document.getElementById('scroll-space');
  const layerA = document.getElementById('seq-a');
  const layerB = document.getElementById('seq-b');
  const overlay = document.getElementById('fade-overlay');
  const doorScene = document.getElementById('door-scene');
  const doorWrapper = document.getElementById('door-wrapper');
  const doorLeft = document.getElementById('door-left');
  const doorRight = document.getElementById('door-right');
  const tunnelInner = document.getElementById('tunnel-inner');
  const preloader = document.getElementById('preloader');

  function setScrollHeight() {
    scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
  }
  setScrollHeight();

  /* ───────────────── HELPERS ───────────────── */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const norm = (v, a, b) => clamp((v - a) / (b - a), 0, 1);
  const ease = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

  function frameIndexFor(scrollY) {
    if (scrollY >= S_SEQ_END) return FRAME_COUNT - 1;
    const progress = clamp(scrollY / S_SEQ_END, 0, 1);
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  /* ───────────────── FRAME CACHE ───────────────── */
  const frames = Array.from({ length: FRAME_COUNT }, () => ({
    status: 0,
    img: null,
    promise: null
  }));

  let activeLayer = layerA;
  let hiddenLayer = layerB;
  let shownFrame = -1;
  let wantedFrame = 0;

  function swapTo(src) {
    if (hiddenLayer.src !== src) hiddenLayer.src = src;
    hiddenLayer.classList.add('active');
    activeLayer.classList.remove('active');

    const tmp = activeLayer;
    activeLayer = hiddenLayer;
    hiddenLayer = tmp;
  }

  function ensureFrame(index, priority = 'auto') {
    if (index < 0 || index >= FRAME_COUNT) return Promise.resolve(null);

    const item = frames[index];
    if (item.status === 2) return Promise.resolve(item.img);
    if (item.promise) return item.promise;

    item.status = 1;

    const img = new Image();
    img.decoding = 'async';
    img.fetchPriority = priority;
    img.src = frameSrc(index);

    item.promise = new Promise((resolve, reject) => {
      img.onload = async () => {
        try {
          if (img.decode) await img.decode();
        } catch (e) {}
        item.status = 2;
        item.img = img;
        resolve(img);
      };

      img.onerror = () => {
        item.status = 3;
        reject(new Error(`Frame non trovato: ${frameSrc(index)}`));
      };
    }).finally(() => {
      item.promise = null;
      if (wantedFrame === index && frames[index].status === 2) {
        startLoop();
      }
    });

    return item.promise;
  }

  function warmFrames(center) {
    ensureFrame(center, 'high');
    ensureFrame(center + 1, 'high');
    ensureFrame(center - 1, 'high');
    ensureFrame(center + 2, 'auto');
    ensureFrame(center - 2, 'auto');
    ensureFrame(center + 3, 'auto');
    ensureFrame(center - 3, 'auto');
    ensureFrame(center + 4, 'auto');
    ensureFrame(center - 4, 'auto');
  }

  function showFrame(index) {
    index = clamp(index, 0, FRAME_COUNT - 1);
    wantedFrame = index;
    warmFrames(index);

    const item = frames[index];
    if (item.status !== 2 || !item.img) return;
    if (shownFrame === index) return;

    shownFrame = index;
    swapTo(item.img.currentSrc || item.img.src);
  }

  function preloadInitial() {
    for (let i = 0; i < Math.min(18, FRAME_COUNT); i++) {
      ensureFrame(i, 'high').catch(() => {});
    }

    let cursor = 18;
    function pump() {
      let count = 0;
      while (cursor < FRAME_COUNT && count < 4) {
        ensureFrame(cursor, 'auto').catch(() => {});
        cursor++;
        count++;
      }

      if (cursor < FRAME_COUNT) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(pump, { timeout: 120 });
        } else {
          setTimeout(pump, 40);
        }
      }
    }

    setTimeout(pump, 80);
  }

  /* ───────────────── SMOOTH RENDER LOOP ───────────────── */
  let targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  let currentScrollY = targetScrollY;
  let running = false;

  function render(scrollY) {
    const frameIdx = frameIndexFor(scrollY);
    showFrame(frameIdx);

    const fadeT = norm(scrollY, S_SEQ_END, S_FADE_END);
    overlay.style.opacity = fadeT.toFixed(3);

    if (scrollY < S_FADE_END) {
      doorScene.style.opacity = '0';
      return;
    }

    doorScene.style.opacity = '1';

    const zoomT = ease(norm(scrollY, S_FADE_END, S_TUNN_END));
    doorWrapper.style.transform = `scale(${(0.08 + zoomT * 3.2).toFixed(4)})`;

    const openT = ease(norm(scrollY, S_FADE_END, S_OPEN_END));
    doorLeft.style.transform  =
      `perspective(900px) rotateY(${(-85 * openT).toFixed(2)}deg)`;
    doorRight.style.transform =
      `perspective(900px) rotateY(${( 85 * openT).toFixed(2)}deg)`;

    const tunnelT = ease(norm(scrollY, S_ZOOM_END, S_TUNN_END));
    tunnelInner.style.transform =
      `translateZ(${(-400 + 400 * tunnelT).toFixed(1)}px) rotateX(${(-20 - 70 * tunnelT).toFixed(2)}deg)`;
  }

  function loop() {
    const delta = targetScrollY - currentScrollY;

    if (Math.abs(delta) > 0.15) {
      currentScrollY += delta * 0.22;
    } else {
      currentScrollY = targetScrollY;
    }

    render(currentScrollY);

    const stillMoving = Math.abs(targetScrollY - currentScrollY) > 0.15;
    const waitingForFrame = frames[wantedFrame]?.status !== 2;

    if (stillMoving || waitingForFrame) {
      requestAnimationFrame(loop);
    } else {
      running = false;
      render(targetScrollY);
    }
  }

  function startLoop() {
    if (running) return;
    running = true;
    requestAnimationFrame(loop);
  }

  /* ───────────────── EVENTS ───────────────── */
  window.addEventListener('scroll', () => {
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    startLoop();
  }, { passive: true });

  window.addEventListener('resize', () => {
    setScrollHeight();
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    currentScrollY = targetScrollY;
    startLoop();
  }, { passive: true });

  /* ───────────────── INIT ───────────────── */
  preloadInitial();

  ensureFrame(0, 'high')
    .then(img => {
      layerA.src = img.currentSrc || img.src;
      shownFrame = 0;
      wantedFrame = 0;
      render(currentScrollY);
    })
    .catch(() => {
      render(currentScrollY);
    });

  // nasconde il preloader dopo un breve delay dall'onload
  window.addEventListener('load', () => {
    setTimeout(() => {
      preloader.classList.add('is-hidden');
    }, 1200);
  });
</script>

</body>
</html>
