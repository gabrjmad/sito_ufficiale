<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gabriele Madeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      color: #fff;
      font-family: "Playfair Display", Georgia, serif;
    }

    #scroll-space {}

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    /* RIMOSSO: #starfield-bg (canvas sfondo interattivo)
    #starfield-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
      background: #000;
    }
    */

    .seq-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      backface-visibility: hidden;
      transform: translateZ(0);
      z-index: 2;
    }

    .seq-layer.active {
      opacity: 1;
    }

    .seq-layer.hidden-after-fade {
      opacity: 0 !important;
      visibility: hidden;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
      z-index: 5;
    }

    /* ───────────────── TEXT REVEAL OVERLAY ───────────────── */

    #text-scroll-overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 300ms linear;
    }

    #text-scroll-overlay.is-visible {
      opacity: 1;
    }

    .text-scroll-inner {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 7vw;
    }

    .text-scroll-block {
      width: min(860px, 84vw);
      display: flex;
      flex-direction: column;
      gap: 0.12em;
      align-items: center;
      text-align: center;
      transform: translateY(-1vh);
    }

    .reveal-line {
      position: relative;
      display: block;
      width: 100%;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 900;
      font-size: clamp(1.3rem, 3.2vw, 3.1rem);
      line-height: 1.01;
      letter-spacing: -0.022em;
      transition: transform 180ms linear, opacity 180ms linear;
    }

    .ghost-line,
    .fill-line {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.18em;
    }

    .ghost-line {
      color: rgba(255, 255, 255, 0.1);
    }

    .fill-line {
      position: absolute;
      inset: 0;
      color: #fff;
    }

    .word {
      display: inline-block;
      white-space: pre;
    }

    .ghost-line .word {
      color: rgba(255,255,255,0.11);
    }

    .fill-line .word {
      color: rgb(255,255,255);
      opacity: 1;
      filter: blur(0px);
      will-change: color, opacity, filter, transform;
      transition: color 100ms linear, opacity 100ms linear, filter 100ms linear, transform 100ms linear;
    }

    /* ───────────────── CINEMATIC PAGELOADER ───────────────── */

    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 20% 0%, #18151f 0%, #050509 42%, #020104 90%);
      display: block;
      opacity: 1;
      visibility: visible;
      overflow: hidden;
      pointer-events: auto;
    }

    #preloader.is-hidden {
      display: none;
    }

    .cp-bg {
      position: absolute;
      inset: 0;
      background: #020108;
      will-change: transform;
      transform: translate3d(0,0,0);
      pointer-events: none;
    }

    .cp-bg-top {
      clip-path: inset(0 0 50% 0);
      transform-origin: 50% 0%;
    }

    .cp-bg-bottom {
      clip-path: inset(50% 0 0 0);
      transform-origin: 50% 100%;
    }

    .cp-content {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 4vw;
      text-align: center;
      z-index: 2;
      will-change: opacity, transform;
    }

    .cp-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cp-words {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      white-space: nowrap;
    }

    #cp-text {
      font-size: clamp(1.1rem, 1.0rem + 0.9vw, 1.8rem);
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      opacity: 0;
      transform: translateY(0.9em);
      transition:
        opacity 520ms ease-out,
        transform 520ms ease-out,
        color 520ms ease-out;
      will-change: opacity, transform;
    }

    #cp-text.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    #preloader.is-splitting .cp-bg-top {
      animation: cpSplitTop 1400ms cubic-bezier(0.22, 0.8, 0.25, 1) forwards;
    }

    #preloader.is-splitting .cp-bg-bottom {
      animation: cpSplitBottom 1400ms cubic-bezier(0.22, 0.8, 0.25, 1) forwards;
    }

    #preloader.is-splitting .cp-content {
      opacity: 0;
      transform: translateY(-12px);
      transition:
        opacity 600ms ease-out,
        transform 600ms ease-out;
    }

    @keyframes cpSplitTop {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-100%); }
    }

    @keyframes cpSplitBottom {
      0%   { transform: translateY(0); }
      100% { transform: translateY(100%); }
    }

    /* ───────────────── STACK SHOWCASE (ex spatial carousel) ───────────────── */

    #spatial-carousel-overlay {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms linear;
      contain: layout paint style;
    }

    #spatial-carousel-overlay.is-visible {
      opacity: 1;
    }

    .spatial-carousel-inner {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 4vw;
      contain: layout paint style;
    }

    .spatial-carousel-track {
      position: relative;
      width: min(840px, 88vw);
      height: min(620px, 82vh);
      pointer-events: none;
      contain: layout paint style;
    }

    .spatial-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(540px, 72vw);
      aspect-ratio: 4 / 3;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(10,10,12,0.95);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow:
        0 18px 40px rgba(0,0,0,0.45),
        0 40px 120px rgba(0,0,0,0.75);
      transform-origin: center center;
      will-change: transform, opacity, filter;
      backface-visibility: hidden;
      contain: layout paint style;
      transition:
        transform 260ms cubic-bezier(0.22,0.8,0.25,1),
        opacity 220ms ease-out,
        filter 220ms ease-out;
    }

    .spatial-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.105), rgba(255,255,255,0.02) 26%, rgba(0,0,0,0.16) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .spatial-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.16),
        inset 0 -20px 40px rgba(0,0,0,0.28);
      pointer-events: none;
      z-index: 2;
    }

    .spatial-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transform: translateZ(0);
      filter: saturate(1.02) contrast(1.02);
    }

    .spatial-card-shadow {
      position: absolute;
      left: 50%;
      top: 64%;
      width: min(380px, 58vw);
      height: clamp(26px, 4.2vh, 40px);
      border-radius: 999px;
      background: radial-gradient(circle, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.24) 45%, rgba(0,0,0,0) 78%);
      transform: translateX(-50%);
      filter: blur(12px);
      opacity: 0;
      will-change: transform, opacity;
      pointer-events: none;
      transition:
        transform 260ms cubic-bezier(0.22,0.8,0.25,1),
        opacity 220ms ease-out;
    }

    @media (max-width: 768px) {
      .text-scroll-block {
        width: min(92vw, 640px);
        gap: 0.16em;
        transform: translateY(0);
      }

      .ghost-line,
      .fill-line {
        gap: 0.14em;
      }

      .reveal-line {
        font-size: clamp(1.18rem, 5.4vw, 2.35rem);
        line-height: 1.04;
      }

      .spatial-carousel-inner {
        padding: 6vw;
      }

      .spatial-carousel-track {
        width: 100%;
        height: 82vh;
      }

      .spatial-card {
        width: min(88vw, 520px);
        border-radius: 22px;
      }

      .spatial-card-shadow {
        width: min(72vw, 360px);
        top: 68%;
      }
    }
  </style>
</head>
<body>

<!-- Preloader cinematico -->
<div id="preloader" aria-hidden="true">
  <div class="cp-bg cp-bg-top"></div>
  <div class="cp-bg cp-bg-bottom"></div>
  <div class="cp-content">
    <div class="cp-inner">
      <div class="cp-words">
        <span id="cp-text">Welcome</span>
      </div>
    </div>
  </div>
</div>

<div id="scroll-space"></div>

<div id="stage">
  <!-- RIMOSSO: canvas starfield-bg -->
  <!-- <canvas id="starfield-bg" aria-hidden="true"></canvas> -->

  <img id="seq-a" class="seq-layer active" alt="" decoding="async" fetchpriority="high">
  <img id="seq-b" class="seq-layer" alt="" decoding="async">

  <div id="text-scroll-overlay" aria-hidden="true">
    <div class="text-scroll-inner">
      <div class="text-scroll-block">
        <div class="reveal-line" data-line="0">
          <div class="ghost-line"></div>
          <div class="fill-line"></div>
        </div>
        <div class="reveal-line" data-line="1">
          <div class="ghost-line"></div>
          <div class="fill-line"></div>
        </div>
        <div class="reveal-line" data-line="2">
          <div class="ghost-line"></div>
          <div class="fill-line"></div>
        </div>
        <div class="reveal-line" data-line="3">
          <div class="ghost-line"></div>
          <div class="fill-line"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Stack tipo StudioShowcase -->
  <div id="spatial-carousel-overlay" aria-hidden="true">
    <div class="spatial-carousel-inner">
      <div class="spatial-carousel-track" id="spatial-carousel-track">
        <div class="spatial-card-shadow" data-shadow="0"></div>
        <div class="spatial-card-shadow" data-shadow="1"></div>
        <div class="spatial-card-shadow" data-shadow="2"></div>
        <div class="spatial-card-shadow" data-shadow="3"></div>
        <div class="spatial-card-shadow" data-shadow="4"></div>
        <div class="spatial-card-shadow" data-shadow="5"></div>

        <div class="spatial-card" data-card="0"><img src="spatial-carousel/photo-1.jpg" alt=""></div>
        <div class="spatial-card" data-card="1"><img src="spatial-carousel/photo-2.jpg" alt=""></div>
        <div class="spatial-card" data-card="2"><img src="spatial-carousel/photo-3.jpg" alt=""></div>
        <div class="spatial-card" data-card="3"><img src="spatial-carousel/photo-4.jpg" alt=""></div>
        <div class="spatial-card" data-card="4"><img src="spatial-carousel/photo-5.jpg" alt=""></div>
        <div class="spatial-card" data-card="5"><img src="spatial-carousel/photo-6.jpg" alt=""></div>
      </div>
    </div>
  </div>

  <div id="fade-overlay"></div>
</div>

<script>
  const FRAME_COUNT = 127;
  const PX_PER_FRAME = window.innerWidth <= 768 ? 30 : 24;
  const FADE_PX = 420;
  const STARFIELD_PX = window.innerWidth <= 768 ? 3200 : 4200;

  const SPATIAL_ITEM_COUNT = 6;
  const SPATIAL_STEP_PX = window.innerWidth <= 768 ? 700 : 860;
  const SPATIAL_PX = SPATIAL_STEP_PX * (SPATIAL_ITEM_COUNT + 1.2);

  const S_SEQ_END  = (FRAME_COUNT - 1) * PX_PER_FRAME;
  const S_FADE_END = S_SEQ_END + FADE_PX;
  const S_STAR_END = S_FADE_END + STARFIELD_PX;

  const TEXT_VISIBLE_END = S_FADE_END + Math.min(3000, STARFIELD_PX * 0.9);
  const S_SPATIAL_START = TEXT_VISIBLE_END + 280;
  const S_SPATIAL_END = S_SPATIAL_START + SPATIAL_PX;

  const TOTAL_PX = S_SPATIAL_END;

  const TEXT_LINES = [
    "questa è la sezione delle foto",
    "scorrendo troverai",
    "la mi adescrizione",
    "lascia un feedback se ti piace il sito."
  ];

  const frameSrc = i => `img-sequence/compressed_${String(i + 2).padStart(3, '0')}.webp`;

  const scrollSpace = document.getElementById('scroll-space');
  const layerA = document.getElementById('seq-a');
  const layerB = document.getElementById('seq-b');
  const overlay = document.getElementById('fade-overlay');
  const preloader = document.getElementById('preloader');

  // RIMOSSO: riferimenti al canvas starfield
  // const starCanvas = document.getElementById('starfield-bg');
  // const starCtx = starCanvas.getContext('2d', { alpha: false });

  const textOverlay = document.getElementById('text-scroll-overlay');
  const revealLineEls = [...document.querySelectorAll('.reveal-line')];

  const spatialOverlay = document.getElementById('spatial-carousel-overlay');
  const spatialCards = [...document.querySelectorAll('.spatial-card')];
  const spatialShadows = [...document.querySelectorAll('.spatial-card-shadow')];

  /* ───────────── Cinematic PageLoader logic ───────────── */

  const cpTextEl = document.getElementById('cp-text');

  const cpPhrases = [
    'Welcome',
    'I am',
    'GABRIELE',
    'this is my portfolio'
  ];

  let cpStep = 0;
  let cpTimer = null;

  function showPhrase(index) {
    if (!cpTextEl) return;
    cpTextEl.classList.remove('is-visible');
    setTimeout(() => {
      cpTextEl.textContent = cpPhrases[index];
      cpTextEl.classList.add('is-visible');
    }, 80);
  }

  function triggerPreloaderSplit() {
    if (!preloader || preloader.classList.contains('is-splitting')) return;

    preloader.classList.add('is-splitting');

    setTimeout(() => {
      preloader.classList.add('is-hidden');
    }, 1500);
  }

  function startCinematicLoader() {
    if (!cpTextEl || !cpPhrases.length) return;

    cpStep = 0;
    cpTextEl.textContent = cpPhrases[cpStep];
    cpTextEl.classList.add('is-visible');

    const WORD_DELAY = 950;
    const LAST_HOLD  = 1300;

    function advance() {
      cpStep += 1;

      if (cpStep < cpPhrases.length) {
        showPhrase(cpStep);
        cpTimer = setTimeout(advance, WORD_DELAY);
      } else {
        setTimeout(() => {
          triggerPreloaderSplit();
        }, LAST_HOLD);
      }
    }

    cpTimer = setTimeout(advance, WORD_DELAY);
  }

  // Parte subito all'esecuzione dello script (niente schermo nero intermedio)
  startCinematicLoader();

  /* ───────────── resto: scroll, stack ───────────── */

  function setScrollHeight() {
    scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
  }
  setScrollHeight();

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const norm = (v, a, b) => clamp((v - a) / (b - a), 0, 1);

  function frameIndexFor(scrollY) {
    if (scrollY >= S_SEQ_END) return FRAME_COUNT - 1;
    const progress = clamp(scrollY / S_SEQ_END, 0, 1);
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  function splitWords(text) {
    return text.split(' ').map(word => word.trim()).filter(Boolean);
  }

  function buildTextReveal() {
    revealLineEls.forEach((lineEl, lineIndex) => {
      const text = TEXT_LINES[lineIndex] || '';
      const words = splitWords(text);

      const ghost = lineEl.querySelector('.ghost-line');
      const fill = lineEl.querySelector('.fill-line');

      ghost.innerHTML = '';
      fill.innerHTML = '';

      words.forEach((word, wordIndex) => {
        const ghostWord = document.createElement('span');
        ghostWord.className = 'word';
        ghostWord.textContent = word;
        ghost.appendChild(ghostWord);

        const fillWord = document.createElement('span');
        fillWord.className = 'word';
        fillWord.textContent = word;
        fillWord.dataset.index = String(wordIndex);
        fillWord.dataset.line = String(lineIndex);
        fill.appendChild(fillWord);
      });
    });
  }

  buildTextReveal();

  const frames = Array.from({ length: FRAME_COUNT }, () => ({
    status: 0,
    img: null,
    promise: null
  }));

  let activeLayer = layerA;
  let hiddenLayer = layerB;
  let shownFrame = -1;
  let wantedFrame = 0;

  function swapTo(src) {
    if (hiddenLayer.src !== src) hiddenLayer.src = src;
    hiddenLayer.classList.add('active');
    activeLayer.classList.remove('active');
    const tmp = activeLayer;
    activeLayer = hiddenLayer;
    hiddenLayer = tmp;
  }

  function ensureFrame(index, priority = 'auto') {
    if (index < 0 || index >= FRAME_COUNT) return Promise.resolve(null);
    const item = frames[index];
    if (item.status === 2) return Promise.resolve(item.img);
    if (item.promise) return item.promise;

    item.status = 1;
    const img = new Image();
    img.decoding = 'async';
    img.fetchPriority = priority;
    img.src = frameSrc(index);

    item.promise = new Promise((resolve, reject) => {
      img.onload = async () => {
        try { if (img.decode) await img.decode(); } catch (e) {}
        item.status = 2;
        item.img = img;
        resolve(img);
      };
      img.onerror = () => {
        item.status = 3;
        reject(new Error(`Frame non trovato: ${frameSrc(index)}`));
      };
    }).finally(() => {
      item.promise = null;
      if (wantedFrame === index && frames[index].status === 2) {
        startLoop();
      }
    });

    return item.promise;
  }

  function warmFrames(center) {
    ensureFrame(center, 'high');
    ensureFrame(center + 1, 'high');
    ensureFrame(center - 1, 'high');
    ensureFrame(center + 2, 'auto');
    ensureFrame(center - 2, 'auto');
    ensureFrame(center + 3, 'auto');
    ensureFrame(center - 3, 'auto');
  }

  function showFrame(index) {
    index = clamp(index, 0, FRAME_COUNT - 1);
    wantedFrame = index;
    warmFrames(index);

    const item = frames[index];
    if (item.status !== 2 || !item.img) return;
    if (shownFrame === index) return;

    shownFrame = index;
    swapTo(item.img.currentSrc || item.img.src);
  }

  function preloadInitial() {
    for (let i = 0; i < Math.min(18, FRAME_COUNT); i++) {
      ensureFrame(i, 'high').catch(() => {});
    }
    let cursor = 18;
    function pump() {
      let count = 0;
      while (cursor < FRAME_COUNT && count < 4) {
        ensureFrame(cursor, 'auto').catch(() => {});
        cursor++;
        count++;
      }
      if (cursor < FRAME_COUNT) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(pump, { timeout: 120 });
        } else {
          setTimeout(pump, 40);
        }
      }
    }
    setTimeout(pump, 80);
  }

  // RIMOSSA TUTTA LA LOGICA STARFIELD: stato, init, resize, pointer, draw
  /*
  const starState = { ... };
  function createStar(...) { ... }
  function resetStar(...) { ... }
  function initStars() { ... }
  function resizeStarfield() { ... }
  function updatePointer(...) { ... }
  function drawStarfield(now) { ... }
  */

  function updateTextReveal(scrollY) {
    const overlayIn = S_FADE_END + 60;
    const overlayOut = TEXT_VISIBLE_END;
    const overlayVisible = scrollY >= overlayIn && scrollY <= overlayOut;
    textOverlay.classList.toggle('is-visible', overlayVisible);

    const revealStart = S_FADE_END + 120;
    const revealEnd = TEXT_VISIBLE_END;
    const globalProgress = norm(scrollY, revealStart, revealEnd);

    revealLineEls.forEach((lineEl, lineIndex) => {
      const fillWords = [...lineEl.querySelectorAll('.fill-line .word')];
      const total = fillWords.length;

      const linesCount = revealLineEls.length;
      const lineStart = lineIndex / linesCount;
      const lineEnd = (lineIndex + 1) / linesCount;
      const lineProgress = clamp((globalProgress - lineStart) / (lineEnd - lineStart), 0, 1);

      fillWords.forEach((wordEl, wordIndex) => {
        const wordSpan = 1 / total;
        const wordStart = wordIndex * wordSpan;
        const wordEnd = wordStart + wordSpan * 0.72;
        const t = clamp((lineProgress - wordStart) / (wordEnd - wordStart), 0, 1);

        const gray = 78;
        const white = 255;
        const ch = Math.round(gray + (white - gray) * t);

        wordEl.style.color = `rgb(${ch}, ${ch}, ${ch})`;
        wordEl.style.opacity = String(0.18 + t * 0.82);
        wordEl.style.filter = `blur(${(1 - t) * 1.55}px)`;
        wordEl.style.transform = `translateY(${(1 - t) * 5}px)`;
      });

      const lineShown = lineProgress > 0.01;
      lineEl.style.opacity = String(lineShown ? (0.28 + lineProgress * 0.72) : 0.2);
      lineEl.style.transform = `translateY(${Math.max(0, 12 - lineProgress * 12)}px)`;
    });
  }

  // Stack stile StudioShowcase
  function updateSpatialCarousel(scrollY) {
    const visibleIn = S_SPATIAL_START + 10;
    const visibleOut = S_SPATIAL_END + 140;
    const visible = scrollY >= visibleIn && scrollY <= visibleOut;
    spatialOverlay.classList.toggle('is-visible', visible);

    const t = norm(scrollY, S_SPATIAL_START, S_SPATIAL_END);
    const activeIndex = t * (SPATIAL_ITEM_COUNT - 1);
    const isMobile = window.innerWidth <= 768;

    const gapY = isMobile ? 32 : 40;
    const gapX = isMobile ? 6 : 10;
    const maxDepth = 3.5;

    spatialCards.forEach((card, i) => {
      const delta = i - activeIndex;
      const abs = Math.abs(delta);
      const d = Math.min(abs, maxDepth);

      const direction = delta >= 0 ? 1 : -1;

      const y = d * gapY * direction;
      const x = delta * gapX;

      const scale = 1 - d * 0.06;
      const opacity = Math.max(0, 1 - d * 0.21);
      const blur = d * 0.7;
      const rotate = delta * (isMobile ? -1.8 : -1.4);

      card.style.zIndex = String(2000 + Math.round((maxDepth - d) * 20));
      card.style.opacity = opacity.toFixed(3);
      card.style.filter = `blur(${blur.toFixed(2)}px)`;
      card.style.transform =
        `translate3d(-50%, -50%, 0) translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) ` +
        `scale(${scale.toFixed(3)}) rotate(${rotate.toFixed(1)}deg)`;
    });

    spatialShadows.forEach((shadow, i) => {
      const delta = i - activeIndex;
      const abs = Math.abs(delta);
      const d = Math.min(abs, maxDepth);

      const x = delta * (isMobile ? 5 : 8);
      const y = d * (isMobile ? 8 : 10);
      const shadowOpacity = Math.max(0, 0.35 - d * 0.08);

      const scale = 1 - d * 0.09;

      shadow.style.opacity = shadowOpacity.toFixed(3);
      shadow.style.transform =
        `translateX(calc(-50% + ${x.toFixed(1)}px)) translateY(${y.toFixed(1)}px) scale(${scale.toFixed(3)})`;
    });
  }

  let targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  let currentScrollY = targetScrollY;
  let running = false;
  let rafId = 0;

  function render(scrollY) {
    const frameIdx = frameIndexFor(scrollY);
    showFrame(frameIdx);

    if (scrollY < S_SEQ_END) {
      overlay.style.opacity = '0';
      layerA.classList.remove('hidden-after-fade');
      layerB.classList.remove('hidden-after-fade');
      textOverlay.classList.remove('is-visible');
      spatialOverlay.classList.remove('is-visible');
    } else if (scrollY < S_FADE_END) {
      const fadeT = norm(scrollY, S_SEQ_END, S_FADE_END);
      overlay.style.opacity = fadeT.toFixed(3);
      textOverlay.classList.remove('is-visible');
      spatialOverlay.classList.remove('is-visible');
    } else {
      overlay.style.opacity = '0';
      layerA.classList.add('hidden-after-fade');
      layerB.classList.add('hidden-after-fade');
    }

    updateTextReveal(scrollY);
    updateSpatialCarousel(scrollY);
  }

  function loop() {
    const delta = targetScrollY - currentScrollY;
    const ease = Math.abs(delta) > 140 ? 0.115 : 0.135;

    if (Math.abs(delta) > 0.1) {
      currentScrollY += delta * ease;
    } else {
      currentScrollY = targetScrollY;
    }

    render(currentScrollY);

    const stillMoving = Math.abs(targetScrollY - currentScrollY) > 0.1;
    const waitingForFrame = frames[wantedFrame]?.status !== 2;

    if (stillMoving || waitingForFrame) {
      rafId = requestAnimationFrame(loop);
    } else {
      running = false;
      rafId = 0;
      render(targetScrollY);
    }
  }

  function startLoop() {
    if (running) return;
    running = true;
    rafId = requestAnimationFrame(loop);
  }

  window.addEventListener('scroll', () => {
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    startLoop();
  }, { passive: true });

  window.addEventListener('resize', () => {
    setScrollHeight();
    buildTextReveal();
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    currentScrollY = targetScrollY;

    // RIMOSSO: resizeStarfield();
    render(currentScrollY);
    startLoop();
  }, { passive: true });

  // RIMOSSI gli handler mouse/touch per lo starfield
  /*
  window.addEventListener('mousemove', e => {
    updatePointer(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (!e.touches[0]) return;
    updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('mouseleave', () => {
    starState.tx = starState.baseCx;
    starState.ty = starState.baseCy;
    starState.driftX = 0;
    starState.driftY = 0;
    starState.mouseSpeedFactor = 1;
  });
  */

  preloadInitial();

  ensureFrame(0, 'high')
    .then(img => {
      layerA.src = img.currentSrc || img.src;
      shownFrame = 0;
      wantedFrame = 0;
      render(currentScrollY);
    })
    .catch(() => {
      render(currentScrollY);
    });

  // RIMOSSI: resizeStarfield() e drawStarfield
  // resizeStarfield();
  // requestAnimationFrame(drawStarfield);
</script>
