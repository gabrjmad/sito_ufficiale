<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scroll Sequence + Porta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      overscroll-behavior: none;
    }
    body { min-height: 100vh; }

    #scroll-space {}

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    /* Due layer immagine per evitare flash neri */
    .seq-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 80ms linear;
      will-change: opacity;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .seq-layer.active {
      opacity: 1;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }

    #door-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    #door-wrapper {
      position: relative;
      width: 360px;
      height: 520px;
      transform-origin: center center;
      transform: scale(0.1);
      will-change: transform;
    }

    #door-svg {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 2;
    }

    #door-tunnel {
      position: absolute;
      top: 16%;
      left: 23%;
      width: 54%;
      height: 64%;
      background: #6fb0e6;
      overflow: hidden;
      perspective: 900px;
      z-index: 1;
    }

    #tunnel-inner {
      position: absolute;
      inset: -60% -60%;
      transform-style: preserve-3d;
      transform-origin: center center;
      will-change: transform;
    }

    .tunnel-word {
      position: absolute;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      color: #f5f7ff;
      white-space: nowrap;
      line-height: 1;
      user-select: none;
      transform-origin: center center;
    }

    #door-left,
    #door-right {
      will-change: transform;
    }
  </style>
</head>
<body>

<div id="scroll-space"></div>

<div id="stage">
  <img id="seq-a" class="seq-layer active" alt="" decoding="async" fetchpriority="high">
  <img id="seq-b" class="seq-layer" alt="" decoding="async">
  <div id="fade-overlay"></div>

  <div id="door-scene">
    <div id="door-wrapper">
      <div id="door-tunnel"><div id="tunnel-inner"></div></div>
      <svg id="door-svg" viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="360" height="520" fill="#000" />
        <rect x="20" y="20" width="320" height="480" fill="#f5f5f5" />
        <rect x="36" y="36" width="288" height="448" fill="#e9e9e9" />
        <rect x="180" y="36" width="2" height="448" fill="#d0d0d0" />

        <g id="door-left" style="transform-origin: 36px 260px; transform-box: fill-box;">
          <rect x="36" y="36" width="144" height="448" fill="#fdfdfd" />
          <rect x="48" y="52" width="120" height="416" fill="#f2f2f2" />
          <rect x="56" y="60" width="104" height="400" fill="#fdfdfd" />
          <rect x="160" y="246" width="8" height="32" rx="4" fill="#d0d0d0" />
        </g>

        <g id="door-right" style="transform-origin: 324px 260px; transform-box: fill-box;">
          <rect x="196" y="36" width="144" height="448" fill="#fdfdfd" />
          <rect x="208" y="52" width="120" height="416" fill="#f2f2f2" />
          <rect x="216" y="60" width="104" height="400" fill="#fdfdfd" />
          <rect x="196" y="246" width="8" height="32" rx="4" fill="#d0d0d0" />
        </g>

        <rect x="20" y="20" width="320" height="480" fill="none" stroke="#d0d0d0" stroke-width="2" />
      </svg>
    </div>
  </div>
</div>

<script>
const FRAME_COUNT  = 127;
const PX_PER_FRAME = 26;
const FADE_PX      = 420;
const DOOR_ZOOM_PX = 1200;
const DOOR_OPEN_PX = 600;
const TUNNEL_PX    = 900;

const S_SEQ_END   = FRAME_COUNT * PX_PER_FRAME;
const S_FADE_END  = S_SEQ_END + FADE_PX;
const S_ZOOM_END  = S_FADE_END + DOOR_ZOOM_PX;
const S_OPEN_END  = S_ZOOM_END + DOOR_OPEN_PX;
const S_TUNN_END  = S_OPEN_END + TUNNEL_PX;
const TOTAL_PX    = S_TUNN_END;

const frameSrc = i => `img-sequence/compressed_${String(i + 2).padStart(3, '0')}.jpg`;

const scrollSpace = document.getElementById('scroll-space');
scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';

const layerA = document.getElementById('seq-a');
const layerB = document.getElementById('seq-b');
const overlay = document.getElementById('fade-overlay');
const doorScene = document.getElementById('door-scene');
const doorWrapper = document.getElementById('door-wrapper');
const doorLeft = document.getElementById('door-left');
const doorRight = document.getElementById('door-right');
const tunnelInner = document.getElementById('tunnel-inner');

const WORDS = [
  { text: 'GABRJMAD', size: 130, x: 5,   y: 10,  rot: -5  },
  { text: 'DESIGNER', size: 90,  x: 55,  y: 18,  rot: 8   },
  { text: 'INVESTOR', size: 110, x: 10,  y: 40,  rot: -8  },
  { text: 'BUISNESS', size: 100, x: 55,  y: 45,  rot: 7   },
  { text: 'MODEL',    size: 140, x: 0,   y: 60,  rot: -10 },
  { text: 'ROUND',    size: 95,  x: 60,  y: 68,  rot: 6   },
  { text: 'FRONT',    size: 120, x: 8,   y: 78,  rot: -7  },
  { text: 'BELLO',    size: 105, x: 58,  y: 82,  rot: 9   },
  { text: 'GABRJMAD', size: 70,  x: -5,  y: 28,  rot: 4   },
  { text: 'DESIGNER', size: 150, x: 25,  y: 52,  rot: -4  },
];

WORDS.forEach(w => {
  const el = document.createElement('div');
  el.className = 'tunnel-word';
  el.textContent = w.text;
  el.style.fontSize = w.size + 'px';
  el.style.left = w.x + '%';
  el.style.top = w.y + '%';
  el.style.transform = `rotate(${w.rot}deg)`;
  tunnelInner.appendChild(el);
});

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const norm  = (v, a, b) => clamp((v - a) / (b - a), 0, 1);
const ease  = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

const loaded = new Array(FRAME_COUNT).fill(false);
const inflight = new Array(FRAME_COUNT).fill(false);
let activeLayer = layerA;
let hiddenLayer = layerB;
let shownFrame = -1;
let queuedFrame = -1;
let rafPending = false;
let lastScrollY = -1;

function swapLayers(nextSrc) {
  if (hiddenLayer.src !== nextSrc) hiddenLayer.src = nextSrc;
  hiddenLayer.classList.add('active');
  activeLayer.classList.remove('active');
  const tmp = activeLayer;
  activeLayer = hiddenLayer;
  hiddenLayer = tmp;
}

function requestFrame(i, priority = 'auto') {
  if (i < 0 || i >= FRAME_COUNT || loaded[i] || inflight[i]) return;
  inflight[i] = true;

  const img = new Image();
  img.decoding = 'async';
  img.fetchPriority = priority;

  img.onload = async () => {
    try {
      if (img.decode) await img.decode();
    } catch (e) {}

    loaded[i] = true;
    inflight[i] = false;

    if (queuedFrame === i) {
      showFrame(i);
    }
  };

  img.onerror = () => {
    inflight[i] = false;
  };

  img.src = frameSrc(i);
}

function warmAround(index) {
  requestFrame(index, 'high');
  requestFrame(index + 1, 'high');
  requestFrame(index - 1, 'high');
  requestFrame(index + 2, 'auto');
  requestFrame(index - 2, 'auto');
  requestFrame(index + 3, 'auto');
  requestFrame(index - 3, 'auto');
}

function showFrame(index) {
  index = clamp(index, 0, FRAME_COUNT - 1);
  queuedFrame = index;
  warmAround(index);

  if (!loaded[index]) return;
  if (shownFrame === index) return;

  shownFrame = index;
  swapLayers(frameSrc(index));
}

requestFrame(0, 'high');
for (let i = 1; i < 10; i++) requestFrame(i, 'high');
setTimeout(() => {
  for (let i = 10; i < FRAME_COUNT; i++) requestFrame(i, 'auto');
}, 120);

function redraw() {
  rafPending = false;

  const sy = window.scrollY || document.documentElement.scrollTop || 0;
  if (sy === lastScrollY) return;
  lastScrollY = sy;

  const frameIdx = sy <= S_SEQ_END
    ? clamp(Math.floor(sy / PX_PER_FRAME), 0, FRAME_COUNT - 1)
    : FRAME_COUNT - 1;

  showFrame(frameIdx);

  const fadeT = norm(sy, S_SEQ_END, S_FADE_END);
  overlay.style.opacity = fadeT.toFixed(3);

  if (sy < S_FADE_END) {
    doorScene.style.opacity = '0';
    return;
  }

  doorScene.style.opacity = '1';

  const zoomT = ease(norm(sy, S_FADE_END, S_TUNN_END));
  doorWrapper.style.transform = `scale(${(0.08 + zoomT * 3.2).toFixed(4)})`;

  const openT = ease(norm(sy, S_FADE_END, S_OPEN_END));
  doorLeft.style.transform  = `perspective(900px) rotateY(${(-85 * openT).toFixed(2)}deg)`;
  doorRight.style.transform = `perspective(900px) rotateY(${( 85 * openT).toFixed(2)}deg)`;

  const tunnelT = ease(norm(sy, S_ZOOM_END, S_TUNN_END));
  tunnelInner.style.transform = `translateZ(${(-400 + 400 * tunnelT).toFixed(1)}px) rotateX(${(-20 - 70 * tunnelT).toFixed(2)}deg)`;
}

window.addEventListener('scroll', () => {
  if (!rafPending) {
    rafPending = true;
    requestAnimationFrame(redraw);
  }
}, { passive: true });

window.addEventListener('resize', () => {
  scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
  redraw();
}, { passive: true });

redraw();
</script>
</body>
</html>
