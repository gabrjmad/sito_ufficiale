<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GABRIELE MADEO</title>
  <meta name="description" content="Esperienza visiva personale di Gabriele Madeo: fly-through tra le nuvole, sequenza cinematografica e viaggi spaziali 3D." />

  <!-- Open Graph / Meta -->
  <meta property="og:title" content="GABRIELE MADEO" />
  <meta property="og:description" content="Esperienza visiva personale, cinematica e spaziale." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="spatial-carousel/photo-3.webp" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Core Libraries: GSAP, ScrollTrigger, Lenis -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js" defer></script>

  <!-- Preload Essential Starting Visuals -->
  <link rel="preload" as="image" href="clouds_panorama.webp" type="image/webp" />
  <link rel="preload" as="image" href="img-sequence/compressed_002.webp" type="image/webp" />

  <style>
    /* ═══════════════════════════════════════════════════════
       DESIGN SYSTEM & RESET
       ═══════════════════════════════════════════════════════ */
    :root {
      --bg-neutral: #0a0a0d;
      --bg-darker: #050507;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
      --text-dim: rgba(255, 255, 255, 0.35);
      --accent: #e4d8c9;
      --cyan-glow: #00f0ff;
      --font-display: 'Syne', sans-serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      background: var(--bg-neutral);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
      overscroll-behavior-y: none;
      scroll-behavior: auto;
    }

    ::selection {
      background: #ffffff;
      color: #000000;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ─── CUSTOM PHOTO CURSOR (DESKTOP) ─── */
    @media (hover: hover) and (pointer: fine) {
      body, a, button, .photo-wrapper, .touch-target {
        cursor: none !important;
      }
    }

    .custom-cursor {
      position: fixed;
      top: 0; left: 0;
      width: 44px; height: 44px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate3d(-50%, -50%, 0);
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.3);
      transition: width 0.28s var(--ease-out), height 0.28s var(--ease-out);
      will-change: transform;
      background: #111;
    }
    .custom-cursor img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .cursor-ring {
      position: fixed;
      top: 0; left: 0;
      width: 64px; height: 64px;
      border: 1.5px dashed rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate3d(-50%, -50%, 0);
      transition: width 0.3s var(--ease-out), height 0.3s var(--ease-out), border-color 0.25s;
      will-change: transform;
    }

    body.cursor-active .custom-cursor {
      width: 68px; height: 68px;
      border-color: #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.6);
    }
    body.cursor-active .cursor-ring {
      width: 88px; height: 88px;
      border-color: rgba(255, 255, 255, 0.8);
      border-style: solid;
    }

    @media (hover: none) or (pointer: coarse) {
      .custom-cursor, .cursor-ring { display: none !important; }
    }

    /* ═══════════════════════════════════════════════════════
       1. HERO: SCHERMATA INIZIALE NEUTRA CON SOLO IL NOME
       ═══════════════════════════════════════════════════════ */
    #hero-intro {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-neutral);
      z-index: 100;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 10vw, 7.8rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      color: #ffffff;
      line-height: 1;
      padding: 0 20px;
      margin-right: -0.18em; /* optical balance for letter-spacing */
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    .hero-scroll-hint {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
      transition: opacity 0.3s;
    }

    .scroll-wheel-icon {
      width: 20px;
      height: 32px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      position: relative;
    }
    .scroll-wheel-dot {
      width: 3px;
      height: 6px;
      background: #ffffff;
      border-radius: 2px;
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      animation: wheelScroll 2s infinite ease-in-out;
    }
    @keyframes wheelScroll {
      0% { transform: translate(-50%, 0); opacity: 1; }
      80% { transform: translate(-50%, 12px); opacity: 0; }
      100% { transform: translate(-50%, 0); opacity: 0; }
    }

    /* ═══════════════════════════════════════════════════════
       2. CLEVIR.LI CLOUDS & PERSPECTIVE CHANGE STAGE
       ═══════════════════════════════════════════════════════ */
    #clouds-dive-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      perspective: 1200px;
      perspective-origin: center center;
      overflow: hidden;
      z-index: 90;
      pointer-events: none;
      will-change: transform, opacity;
      background: #0a0a0d;
      opacity: 0;
    }

    .clouds-panorama-backdrop {
      position: absolute;
      inset: -20%;
      width: 140%;
      height: 140%;
      background-image: url('clouds_panorama.webp');
      background-size: cover;
      background-position: center;
      opacity: 0.85;
      transform: translateZ(-300px) scale(1.4);
      filter: blur(1px) brightness(1.05);
      will-change: transform, opacity;
    }

    /* 3D Volumetric Cloud Masses that split apart */
    .clouds-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .cloud-mass {
      position: absolute;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.95) 0%, rgba(240, 245, 255, 0.75) 45%, rgba(220, 235, 255, 0) 75%);
      border-radius: 50%;
      filter: blur(28px);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .cloud-mass--left-1 {
      width: 90vw; height: 90vh;
      top: -15vh; left: -25vw;
      transform: translateZ(100px);
    }
    .cloud-mass--right-1 {
      width: 95vw; height: 95vh;
      top: -20vh; right: -25vw;
      transform: translateZ(200px);
    }
    .cloud-mass--left-2 {
      width: 75vw; height: 75vh;
      bottom: -15vh; left: -10vw;
      transform: translateZ(350px);
    }
    .cloud-mass--right-2 {
      width: 80vw; height: 80vh;
      bottom: -20vh; right: -15vw;
      transform: translateZ(450px);
    }
    .cloud-mass--center {
      width: 60vw; height: 60vh;
      top: 20vh; left: 20vw;
      transform: translateZ(50px);
      opacity: 0.7;
    }

    /* ═══════════════════════════════════════════════════════
       3. 117-FRAME LANDSCAPE SEQUENCE CANVAS
       ═══════════════════════════════════════════════════════ */
    #sequence-fixed-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
    }

    #sequence-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ═══════════════════════════════════════════════════════
       SCROLL TRACKS (DRIVES THE TIMELINES ON SCROLL)
       ═══════════════════════════════════════════════════════ */
    #scroll-container {
      position: relative;
      width: 100%;
      z-index: 10;
    }

    /* Virtual scroll spacers for sequence */
    #intro-track {
      height: 120vh;
    }
    #clouds-track {
      height: 180vh;
    }
    #sequence-track {
      height: 480vh; /* Smooth, natural scrub through the 117 frames */
    }

    /* ═══════════════════════════════════════════════════════
       4. THE 3D SPATIAL JOURNEY ACROSS THE 6 AUTHOR PHOTOS
       ═══════════════════════════════════════════════════════ */
    .author-gallery-stage {
      position: relative;
      width: 100%;
      background: var(--bg-darker);
      z-index: 60;
    }

    .gallery-station {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-darker);
    }

    .photo-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-clean-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateZ(0);
      will-change: transform, opacity;
      transition: filter 0.3s ease;
    }

    /* Protected focal positions */
    .focal-1 { object-position: 50% 40%; }
    .focal-2 { object-position: 50% 50%; }
    .focal-3 { object-position: 50% 38%; } /* Protected face/horizon */
    .focal-4 { object-position: 50% 32%; } /* Protected shadow portrait head */
    .focal-5 { object-position: 50% 45%; }
    .focal-6 { object-position: 50% 50%; }

    /* Vignette protection */
    .clean-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(5, 5, 7, 0.65) 100%);
      z-index: 2;
    }

    /* Minimalist Inspection Trigger (No text, pure icon) */
    .inspect-trigger {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 24px);
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(20, 20, 26, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s var(--ease-out);
    }
    .inspect-trigger:hover {
      background: #ffffff;
      color: #000000;
      transform: scale(1.1);
    }

    /* ═══════════════════════════════════════════════════════
       SPATIAL 3D EFFECTS (TUNNEL, UNFOLDING BOX, VORTEX)
       ═══════════════════════════════════════════════════════ */

    /* EFFECT 1: 3D GEOMETRIC TUNNEL (Prima di Foto 2) */
    .tunnel-stage {
      position: relative;
      width: 100%;
      height: 200vh;
      background: #030305;
      overflow: hidden;
    }
    .tunnel-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      perspective: 800px;
      perspective-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .tunnel-viewport {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .tunnel-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.05);
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* EFFECT 2: 3D UNFOLDING BOX (Prima di Foto 3) */
    .box-unfold-stage {
      position: relative;
      width: 100%;
      height: 220vh;
      background: #020204;
      overflow: hidden;
    }
    .box-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      perspective: 1000px;
      perspective-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .box-3d-wrapper {
      position: relative;
      width: min(75vw, 420px);
      height: min(75vw, 420px);
      transform-style: preserve-3d;
      will-change: transform;
    }
    .box-face {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(35, 35, 45, 0.95) 0%, rgba(15, 15, 20, 0.95) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    .box-face--front  { transform: translateZ(min(37.5vw, 210px)); }
    .box-face--back   { transform: rotateY(180deg) translateZ(min(37.5vw, 210px)); }
    .box-face--top    { transform: rotateX(90deg) translateZ(min(37.5vw, 210px)); transform-origin: top; }
    .box-face--bottom { transform: rotateX(-90deg) translateZ(min(37.5vw, 210px)); transform-origin: bottom; }
    .box-face--left   { transform: rotateY(-90deg) translateZ(min(37.5vw, 210px)); transform-origin: left; }
    .box-face--right  { transform: rotateY(90deg) translateZ(min(37.5vw, 210px)); transform-origin: right; }

    .box-inner-reveal {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: translateZ(0);
      will-change: transform, opacity;
      border-radius: 12px;
      overflow: hidden;
    }
    .box-inner-reveal img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* EFFECT 3: 3D DEPTH VORTEX (Prima di Foto 4) */
    .vortex-stage {
      position: relative;
      width: 100%;
      height: 180vh;
      background: #040406;
      overflow: hidden;
    }
    .vortex-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      perspective: 900px;
      perspective-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .vortex-disc {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* EFFECT 4: 3D PRISMATIC SHIELD (Prima di Foto 5) */
    .prism-stage {
      position: relative;
      width: 100%;
      height: 180vh;
      background: #020204;
      overflow: hidden;
    }
    .prism-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .prism-panel {
      position: absolute;
      width: 50vw;
      height: 50vh;
      background: rgba(20, 20, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      will-change: transform, opacity;
    }
    .prism-panel--tl { top: 0; left: 0; transform-origin: top left; }
    .prism-panel--tr { top: 0; right: 0; transform-origin: top right; }
    .prism-panel--bl { bottom: 0; left: 0; transform-origin: bottom left; }
    .prism-panel--br { bottom: 0; right: 0; transform-origin: bottom right; }

    /* ═══════════════════════════════════════════════════════
       5. EPILOGUE & INSTAGRAM PROMINENT CARD
       ═══════════════════════════════════════════════════════ */
    .epilogue-stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-neutral);
      z-index: 70;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 24px calc(var(--safe-bottom) + 60px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .epilogue-content {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .epilogue-tag {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .epilogue-headline {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 36px;
    }

    /* Instagram Master Card */
    .instagram-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(25, 25, 34, 0.7) 0%, rgba(12, 12, 18, 0.85) 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 40px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.35s var(--ease-out);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      text-decoration: none;
      color: var(--text);
    }
    .instagram-card:hover {
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-3px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(255, 255, 255, 0.1);
    }

    @media (min-width: 640px) {
      .instagram-card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 36px 40px;
        text-align: left;
      }
    }

    .ig-avatar-wrap {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      flex-shrink: 0;
    }
    .ig-avatar-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid #0a0a0d;
    }

    .ig-user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ig-handle {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      display: block;
      margin-bottom: 4px;
    }
    .ig-bio {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: block;
    }

    .ig-cta-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 999px;
      background: #ffffff;
      color: #000000;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.25s var(--ease-out);
      flex-shrink: 0;
    }
    .instagram-card:hover .ig-cta-pill {
      background: var(--accent);
      transform: scale(1.05);
    }

    .epilogue-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      width: 100%;
    }
    @media (min-width: 600px) {
      .epilogue-footer {
        flex-direction: row;
        justify-content: space-between;
      }
    }
    .epilogue-copy {
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .back-to-top {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-to-top:hover {
      color: #ffffff;
    }

    /* ═══════════════════════════════════════════════════════
       LIGHTBOX / INSPECTOR MODAL
       ═══════════════════════════════════════════════════════ */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 99990;
      background: rgba(3, 3, 5, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-out);
    }
    .lightbox-modal.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-modal img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }
    .lightbox-close {
      position: absolute;
      top: calc(var(--safe-top) + 20px);
      right: 24px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lightbox-close:hover {
      background: #ffffff;
      color: #000000;
    }

    /* ═══════════════════════════════════════════════════════
       ACCESSIBILITY & REDUCED MOTION
       ═══════════════════════════════════════════════════════ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      #hero-intro { position: relative !important; height: 100vh !important; }
      #sequence-fixed-stage { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Custom Photo Cursor (Desktop fine pointer only) -->
  <div class="custom-cursor" id="custom-cursor" aria-hidden="true">
    <img src="spatial-carousel/photo-3.webp" alt="Cursor Photo" id="cursor-thumb">
  </div>
  <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>

  <!-- 1. HERO INIZIALE: SOLO LA SCRITTA GABRIELE MADEO -->
  <section id="hero-intro">
    <h1 class="hero-name">GABRIELE MADEO</h1>
    <div class="hero-scroll-hint" id="hero-hint">
      <div class="scroll-wheel-icon">
        <div class="scroll-wheel-dot"></div>
      </div>
      <span>Scorri per entrare</span>
    </div>
  </section>

  <!-- 2. CLEVIR.LI STYLE CLOUD DIVE & 3D PERSPECTIVE STAGE -->
  <div id="clouds-dive-stage" aria-hidden="true">
    <div class="clouds-panorama-backdrop" id="clouds-backdrop"></div>
    <div class="clouds-layer" id="clouds-layer">
      <div class="cloud-mass cloud-mass--left-1" id="cloud-l1"></div>
      <div class="cloud-mass cloud-mass--right-1" id="cloud-r1"></div>
      <div class="cloud-mass cloud-mass--left-2" id="cloud-l2"></div>
      <div class="cloud-mass cloud-mass--right-2" id="cloud-r2"></div>
      <div class="cloud-mass cloud-mass--center" id="cloud-c"></div>
    </div>
  </div>

  <!-- 3. 117-FRAME LANDSCAPE SEQUENCE CANVAS -->
  <div id="sequence-fixed-stage" aria-hidden="true">
    <canvas id="sequence-canvas"></canvas>
  </div>

  <!-- SCROLL TRACK DRIVERS -->
  <div id="scroll-container">
    <div id="intro-track"></div>
    <div id="clouds-track"></div>
    <div id="sequence-track"></div>

    <!-- 4. THE 3D SPATIAL JOURNEY ACROSS THE 6 AUTHOR PHOTOS -->
    <div class="author-gallery-stage" id="gallery-stage">

      <!-- FOTO 1: Emerges from landscape sequence into full screen -->
      <section class="gallery-station" id="station-1" data-cursor="spatial-carousel/photo-1.webp">
        <div class="photo-wrapper">
          <picture>
            <source srcset="spatial-carousel/photo-1.webp" type="image/webp">
            <img src="spatial-carousel/photo-1.jpg" alt="Foto 1" class="photo-clean-img focal-1" loading="lazy" decoding="async">
          </picture>
          <div class="clean-vignette"></div>
          <button class="inspect-trigger touch-target" data-full="spatial-carousel/photo-1.jpg" aria-label="Espandi scatto">⊕</button>
        </div>
      </section>

      <!-- EFFETTO VISIVO SPATIAL: 3D GEOMETRIC TUNNEL (Prima di Foto 2) -->
      <div class="tunnel-stage" id="tunnel-stage-2">
        <div class="tunnel-sticky">
          <div class="tunnel-viewport" id="tunnel-viewport-2">
            <!-- 8 Concentric 3D Tunnel Rings with varying depth -->
            <div class="tunnel-ring" style="width: 280px; height: 380px; transform: translate3d(-50%, -50%, -1200px);"></div>
            <div class="tunnel-ring" style="width: 380px; height: 500px; transform: translate3d(-50%, -50%, -900px);"></div>
            <div class="tunnel-ring" style="width: 480px; height: 620px; transform: translate3d(-50%, -50%, -600px);"></div>
            <div class="tunnel-ring" style="width: 580px; height: 740px; transform: translate3d(-50%, -50%, -300px);"></div>
            <div class="tunnel-ring" style="width: 680px; height: 860px; transform: translate3d(-50%, -50%, 0px);"></div>
            <div class="tunnel-ring" style="width: 780px; height: 980px; transform: translate3d(-50%, -50%, 300px);"></div>
            <div class="tunnel-ring" style="width: 880px; height: 1100px; transform: translate3d(-50%, -50%, 600px);"></div>
            <div class="tunnel-ring" style="width: 980px; height: 1220px; transform: translate3d(-50%, -50%, 900px);"></div>
          </div>
        </div>
      </div>

      <!-- FOTO 2: Full screen, pure photography -->
      <section class="gallery-station" id="station-2" data-cursor="spatial-carousel/photo-2.webp">
        <div class="photo-wrapper">
          <picture>
            <source srcset="spatial-carousel/photo-2.webp" type="image/webp">
            <img src="spatial-carousel/photo-2.jpg" alt="Foto 2" class="photo-clean-img focal-2" loading="lazy" decoding="async">
          </picture>
          <div class="clean-vignette"></div>
          <button class="inspect-trigger touch-target" data-full="spatial-carousel/photo-2.jpg" aria-label="Espandi scatto">⊕</button>
        </div>
      </section>

      <!-- EFFETTO VISIVO SPATIAL: 3D UNFOLDING BOX (Prima di Foto 3) -->
      <div class="box-unfold-stage" id="box-unfold-stage-3">
        <div class="box-sticky">
          <div class="box-3d-wrapper" id="box-3d">
            <!-- 6 Faces that unfold outward in 3D -->
            <div class="box-face box-face--front" id="box-f-front"></div>
            <div class="box-face box-face--top" id="box-f-top"></div>
            <div class="box-face box-face--bottom" id="box-f-bottom"></div>
            <div class="box-face box-face--left" id="box-f-left"></div>
            <div class="box-face box-face--right" id="box-f-right"></div>
            <div class="box-face box-face--back" id="box-f-back"></div>
            <!-- Center piece inside box -->
            <div class="box-inner-reveal" id="box-inner-img">
              <img src="spatial-carousel/photo-3.webp" alt="Foto 3 Inside Box">
            </div>
          </div>
        </div>
      </div>

      <!-- FOTO 3: Full screen Masterpiece -->
      <section class="gallery-station" id="station-3" data-cursor="spatial-carousel/photo-3.webp">
        <div class="photo-wrapper">
          <picture>
            <source srcset="spatial-carousel/photo-3.webp" type="image/webp">
            <img src="spatial-carousel/photo-3.jpg" alt="Foto 3" class="photo-clean-img focal-3" loading="lazy" decoding="async">
          </picture>
          <div class="clean-vignette"></div>
          <button class="inspect-trigger touch-target" data-full="spatial-carousel/photo-3.jpg" aria-label="Espandi scatto">⊕</button>
        </div>
      </section>

      <!-- EFFETTO VISIVO SPATIAL: 3D DEPTH VORTEX (Prima di Foto 4) -->
      <div class="vortex-stage" id="vortex-stage-4">
        <div class="vortex-sticky">
          <div class="vortex-disc" id="v-disc-1" style="width: 250px; height: 250px;"></div>
          <div class="vortex-disc" id="v-disc-2" style="width: 450px; height: 450px;"></div>
          <div class="vortex-disc" id="v-disc-3" style="width: 650px; height: 650px;"></div>
          <div class="vortex-disc" id="v-disc-4" style="width: 850px; height: 850px;"></div>
        </div>
      </div>

      <!-- FOTO 4: Studio Shadow Portrait -->
      <section class="gallery-station" id="station-4" data-cursor="spatial-carousel/photo-4.webp">
        <div class="photo-wrapper">
          <picture>
            <source srcset="spatial-carousel/photo-4.webp" type="image/webp">
            <img src="spatial-carousel/photo-4.jpg" alt="Foto 4" class="photo-clean-img focal-4" loading="lazy" decoding="async">
          </picture>
          <div class="clean-vignette"></div>
          <button class="inspect-trigger touch-target" data-full="spatial-carousel/photo-4.jpg" aria-label="Espandi scatto">⊕</button>
        </div>
      </section>

      <!-- EFFETTO VISIVO SPATIAL: 3D PRISMATIC PANELS (Prima di Foto 5) -->
      <div class="prism-stage" id="prism-stage-5">
        <div class="prism-sticky">
          <div class="prism-panel prism-panel--tl" id="prism-tl"></div>
          <div class="prism-panel prism-panel--tr" id="prism-tr"></div>
          <div class="prism-panel prism-panel--bl" id="prism-bl"></div>
          <div class="prism-panel prism-panel--br" id="prism-br"></div>
        </div>
      </div>

      <!-- FOTO 5: Texture & Natura -->
      <section class="gallery-station" id="station-5" data-cursor="spatial-carousel/photo-5.webp">
        <div class="photo-wrapper">
          <picture>
            <source srcset="spatial-carousel/photo-5.webp" type="image/webp">
            <img src="spatial-carousel/photo-5.jpg" alt="Foto 5" class="photo-clean-img focal-5" loading="lazy" decoding="async">
          </picture>
          <div class="clean-vignette"></div>
          <button class="inspect-trigger touch-target" data-full="spatial-carousel/photo-5.jpg" aria-label="Espandi scatto">⊕</button>
        </div>
      </section>

      <!-- FOTO 6: Geometria finale -->
      <section class="gallery-station" id="station-6" data-cursor="spatial-carousel/photo-6.webp">
        <div class="photo-wrapper">
          <picture>
            <source srcset="spatial-carousel/photo-6.webp" type="image/webp">
            <img src="spatial-carousel/photo-6.jpg" alt="Foto 6" class="photo-clean-img focal-6" loading="lazy" decoding="async">
          </picture>
          <div class="clean-vignette"></div>
          <button class="inspect-trigger touch-target" data-full="spatial-carousel/photo-6.jpg" aria-label="Espandi scatto">⊕</button>
        </div>
      </section>

    </div>

    <!-- 5. EPILOGUE & INSTAGRAM MASTER CARD -->
    <section class="epilogue-stage" id="connessione">
      <div class="epilogue-content">
        <div class="epilogue-tag">GABRIELE MADEO // ARCHIVIO VISIVO</div>
        <h2 class="epilogue-headline">Vivere lo spazio attraverso lo sguardo.</h2>

        <!-- Master Instagram Card -->
        <a href="https://www.instagram.com/gabrielemadeo" target="_blank" rel="noopener noreferrer" class="instagram-card touch-target" id="instagram-card">
          <div class="ig-user-info">
            <div class="ig-avatar-wrap">
              <img src="spatial-carousel/photo-3.webp" alt="Gabriele Madeo" class="ig-avatar-img">
            </div>
            <div>
              <span class="ig-handle">@gabrielemadeo</span>
              <span class="ig-bio">Fotografia cinematografica, geometrie e nuovi scatti</span>
            </div>
          </div>
          <div class="ig-cta-pill">
            <span>Segui su Instagram</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
        </a>

        <!-- Footer Bottom Links -->
        <div class="epilogue-footer">
          <span class="epilogue-copy">© 2026 Gabriele Madeo</span>
          <button class="back-to-top touch-target" id="back-to-top" aria-label="Torna all'inizio">
            <span>Torna all'inizio</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- Lightbox Modal for Full View -->
  <div class="lightbox-modal" id="lightbox" aria-modal="true" role="dialog" aria-hidden="true">
    <button class="lightbox-close touch-target" id="lightbox-close" aria-label="Chiudi">✕</button>
    <img src="" alt="Dettaglio scatto" id="lightbox-img">
  </div>

  <!-- Main Motion Controller Script -->
  <script src="zoom-parallax.js" defer></script>
</body>
</html>
