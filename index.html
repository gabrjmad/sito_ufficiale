<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gabriele Madeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      color: #fff;
      font-family: "Playfair Display", Georgia, serif;
    }

    #scroll-space {}

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    #starfield-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
      background: #000;
    }

    .seq-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      backface-visibility: hidden;
      transform: translateZ(0);
      z-index: 2;
    }

    .seq-layer.active {
      opacity: 1;
    }

    .seq-layer.hidden-after-fade {
      opacity: 0 !important;
      visibility: hidden;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
      z-index: 5;
    }

    /* ───────────────── TEXT REVEAL OVERLAY ───────────────── */

    #text-scroll-overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 300ms linear;
    }

    #text-scroll-overlay.is-visible {
      opacity: 1;
    }

    .text-scroll-inner {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 7vw;
    }

    .text-scroll-block {
      width: min(860px, 84vw);
      display: flex;
      flex-direction: column;
      gap: 0.12em;
      align-items: center;
      text-align: center;
      transform: translateY(-1vh);
    }

    .reveal-line {
      position: relative;
      display: block;
      width: 100%;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 900;
      font-size: clamp(1.3rem, 3.2vw, 3.1rem);
      line-height: 1.01;
      letter-spacing: -0.022em;
      transition: transform 180ms linear, opacity 180ms linear;
    }

    .ghost-line,
    .fill-line {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.18em;
    }

    .ghost-line {
      color: rgba(255, 255, 255, 0.1);
    }

    .fill-line {
      position: absolute;
      inset: 0;
      color: #fff;
    }

    .word {
      display: inline-block;
      white-space: pre;
    }

    .ghost-line .word {
      color: rgba(255,255,255,0.11);
    }

    .fill-line .word {
      color: rgb(255,255,255);
      opacity: 1;
      filter: blur(0px);
      will-change: color, opacity, filter, transform;
      transition: color 100ms linear, opacity 100ms linear, filter 100ms linear, transform 100ms linear;
    }

    /* ───────────────── CINEMATIC PAGELOADER ───────────────── */

    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 20% 0%, #18151f 0%, #050509 42%, #020104 90%);
      display: block;
      opacity: 1;
      visibility: visible;
      transition: opacity 900ms ease, visibility 900ms ease;
      overflow: hidden;
      pointer-events: auto;
    }

    #preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cp-bg {
      position: absolute;
      inset: 0;
      background: #020108;
      will-change: transform;
      transform: translate3d(0,0,0);
      pointer-events: none;
    }

    .cp-bg-top {
      clip-path: inset(0 0 50% 0);
      transform-origin: 50% 0%;
    }

    .cp-bg-bottom {
      clip-path: inset(50% 0 0 0);
      transform-origin: 50% 100%;
    }

    .cp-content {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 4vw;
      text-align: center;
      z-index: 2;
      will-change: opacity, transform;
    }

    .cp-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cp-words {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      white-space: nowrap;
    }

    #cp-text {
      font-size: clamp(1.1rem, 1.0rem + 0.9vw, 1.8rem);
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      opacity: 0;
      transform: translateY(0.9em);
      transition:
        opacity 520ms ease-out,
        transform 520ms ease-out,
        color 520ms ease-out;
      will-change: opacity, transform;
    }

    #cp-text.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    #preloader.is-splitting .cp-bg-top {
      animation: cpSplitTop 1200ms cubic-bezier(0.19,0.8,0.22,1) forwards;
    }

    #preloader.is-splitting .cp-bg-bottom {
      animation: cpSplitBottom 1200ms cubic-bezier(0.19,0.8,0.22,1) forwards;
    }

    #preloader.is-splitting .cp-content {
      opacity: 0;
      transform: translateY(-12px);
      transition:
        opacity 600ms ease-out,
        transform 600ms ease-out;
    }

    @keyframes cpSplitTop {
      0%   { transform: translate3d(0,0,0); }
      100% { transform: translate3d(0,-100%,0); }
    }

    @keyframes cpSplitBottom {
      0%   { transform: translate3d(0,0,0); }
      100% { transform: translate3d(0,100%,0); }
    }

    /* ───────────────── SPATIAL CAROUSEL OVERLAY ───────────────── */

    #spatial-carousel-overlay {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms linear;
      contain: layout paint style;
    }

    #spatial-carousel-overlay.is-visible {
      opacity: 1;
    }

    .spatial-carousel-inner {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 4vw;
      perspective: 1800px;
      perspective-origin: 50% 58%;
      contain: layout paint style;
    }

    .spatial-carousel-track {
      position: relative;
      width: min(1380px, 96vw);
      height: min(86vh, 980px);
      pointer-events: none;
      transform-style: preserve-3d;
      contain: layout paint style;
    }

    .spatial-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(190px, 22vw, 320px);
      aspect-ratio: 9 / 16;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        0 12px 34px rgba(0,0,0,0.28),
        0 30px 90px rgba(0,0,0,0.52);
      transform-origin: center center;
      will-change: transform, opacity, filter;
      backface-visibility: hidden;
      contain: layout paint style;
    }

    .spatial-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.03) 24%, rgba(0,0,0,0.1) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .spatial-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -18px 40px rgba(0,0,0,0.2);
      pointer-events: none;
      z-index: 2;
    }

    .spatial-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transform: translateZ(0);
      filter: saturate(1.02) contrast(1.02);
    }

    .spatial-card-shadow {
      position: absolute;
      left: 50%;
      top: calc(50% + min(30vh, 245px));
      width: clamp(180px, 20vw, 300px);
      height: clamp(24px, 4vh, 42px);
      border-radius: 999px;
      background: radial-gradient(circle, rgba(0,0,0,0.44) 0%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0) 76%);
      transform: translateX(-50%);
      filter: blur(10px);
      opacity: 0;
      will-change: transform, opacity;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .text-scroll-block {
        width: min(92vw, 640px);
        gap: 0.16em;
        transform: translateY(0);
      }

      .ghost-line,
      .fill-line {
        gap: 0.14em;
      }

      .reveal-line {
        font-size: clamp(1.18rem, 5.4vw, 2.35rem);
        line-height: 1.04;
      }

      .spatial-carousel-inner {
        padding: 6vw;
      }

      .spatial-carousel-track {
        width: 100%;
        height: 82vh;
      }

      .spatial-card {
        width: clamp(170px, 44vw, 250px);
        border-radius: 22px;
      }

      .spatial-card-shadow {
        width: clamp(150px, 38vw, 216px);
        top: calc(50% + 27vh);
      }
    }
  </style>
</head>
<body>

<!-- Preloader cinematico -->
<div id="preloader" aria-hidden="true">
  <div class="cp-bg cp-bg-top"></div>
  <div class="cp-bg cp-bg-bottom"></div>
  <div class="cp-content">
    <div class="cp-inner">
      <div class="cp-words">
        <span id="cp-text">Welcome</span>
      </div>
    </div>
  </div>
</div>

<div id="scroll-space"></div>

<div id="stage">
  <canvas id="starfield-bg" aria-hidden="true"></canvas>

  <img id="seq-a" class="seq-layer active" alt="" decoding="async" fetchpriority="high">
  <img id="seq-b" class="seq-layer" alt="" decoding="async">

  <div id="text-scroll-overlay" aria-hidden="true">
    <div class="text-scroll-inner">
      <div class="text-scroll-block">
        <div class="reveal-line" data-line="0">
          <div class="ghost-line"></div>
          <div class="fill-line"></div>
        </div>
        <div class="reveal-line" data-line="1">
          <div class="ghost-line"></div>
          <div class="fill-line"></div>
        </div>
        <div class="reveal-line" data-line="2">
          <div class="ghost-line"></div>
          <div class="fill-line"></div>
        </div>
        <div class="reveal-line" data-line="3">
          <div class="ghost-line"></div>
          <div class="fill-line"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="spatial-carousel-overlay" aria-hidden="true">
    <div class="spatial-carousel-inner">
      <div class="spatial-carousel-track" id="spatial-carousel-track">
        <div class="spatial-card-shadow" data-shadow="0"></div>
        <div class="spatial-card-shadow" data-shadow="1"></div>
        <div class="spatial-card-shadow" data-shadow="2"></div>
        <div class="spatial-card-shadow" data-shadow="3"></div>
        <div class="spatial-card-shadow" data-shadow="4"></div>
        <div class="spatial-card-shadow" data-shadow="5"></div>

        <div class="spatial-card" data-card="0"><img src="spatial-carousel/photo-1.jpg" alt=""></div>
        <div class="spatial-card" data-card="1"><img src="spatial-carousel/photo-2.jpg" alt=""></div>
        <div class="spatial-card" data-card="2"><img src="spatial-carousel/photo-3.jpg" alt=""></div>
        <div class="spatial-card" data-card="3"><img src="spatial-carousel/photo-4.jpg" alt=""></div>
        <div class="spatial-card" data-card="4"><img src="spatial-carousel/photo-5.jpg" alt=""></div>
        <div class="spatial-card" data-card="5"><img src="spatial-carousel/photo-6.jpg" alt=""></div>
      </div>
    </div>
  </div>

  <div id="fade-overlay"></div>
</div>

<script>
  const FRAME_COUNT = 127;
  const PX_PER_FRAME = window.innerWidth <= 768 ? 30 : 24;
  const FADE_PX = 420;
  const STARFIELD_PX = window.innerWidth <= 768 ? 3200 : 4200;

  const SPATIAL_ITEM_COUNT = 6;
  const SPATIAL_STEP_PX = window.innerWidth <= 768 ? 700 : 860;
  const SPATIAL_PX = SPATIAL_STEP_PX * (SPATIAL_ITEM_COUNT + 1.2);

  const S_SEQ_END  = (FRAME_COUNT - 1) * PX_PER_FRAME;
  const S_FADE_END = S_SEQ_END + FADE_PX;
  const S_STAR_END = S_FADE_END + STARFIELD_PX;

  const TEXT_VISIBLE_END = S_FADE_END + Math.min(3000, STARFIELD_PX * 0.9);
  const S_SPATIAL_START = TEXT_VISIBLE_END + 280;
  const S_SPATIAL_END = S_SPATIAL_START + SPATIAL_PX;

  const TOTAL_PX = S_SPATIAL_END;

  const TEXT_LINES = [
    "questa è la sezione delle foto",
    "scorrendo troverai",
    "la mi adescrizione",
    "lascia un feedback se ti piace il sito."
  ];

  const frameSrc = i => `img-sequence/compressed_${String(i + 2).padStart(3, '0')}.jpg`;

  const scrollSpace = document.getElementById('scroll-space');
  const layerA = document.getElementById('seq-a');
  const layerB = document.getElementById('seq-b');
  const overlay = document.getElementById('fade-overlay');
  const preloader = document.getElementById('preloader');
  const starCanvas = document.getElementById('starfield-bg');
  const starCtx = starCanvas.getContext('2d', { alpha: false });
  const textOverlay = document.getElementById('text-scroll-overlay');
  const revealLineEls = [...document.querySelectorAll('.reveal-line')];

  const spatialOverlay = document.getElementById('spatial-carousel-overlay');
  const spatialCards = [...document.querySelectorAll('.spatial-card')];
  const spatialShadows = [...document.querySelectorAll('.spatial-card-shadow')];

  /* ───────────── Cinematic PageLoader logic ───────────── */

  const cpTextEl = document.getElementById('cp-text');

  const cpPhrases = [
    'Welcome',
    'i am',
    'GABRIELE',
    'this is my portfolio'
  ];

  let cpStep = 0;
  let cpTimer = null;

  function showPhrase(index) {
    if (!cpTextEl) return;
    cpTextEl.classList.remove('is-visible');
    setTimeout(() => {
      cpTextEl.textContent = cpPhrases[index];
      cpTextEl.classList.add('is-visible');
    }, 120);
  }

  function triggerPreloaderSplit() {
    if (!preloader || preloader.classList.contains('is-splitting')) return;

    preloader.classList.add('is-splitting');

    setTimeout(() => {
      preloader.classList.add('is-hidden');
    }, 1100);
  }

  function startCinematicLoader() {
    if (!cpTextEl || !cpPhrases.length) return;

    cpStep = 0;
    cpTextEl.textContent = cpPhrases[cpStep];
    cpTextEl.classList.add('is-visible');

    const WORD_DELAY = 950;
    const LAST_HOLD  = 1300;

    function advance() {
      cpStep += 1;

      if (cpStep < cpPhrases.length) {
        showPhrase(cpStep);
        cpTimer = setTimeout(advance, WORD_DELAY);
      } else {
        setTimeout(() => {
          triggerPreloaderSplit();
        }, LAST_HOLD);
      }
    }

    cpTimer = setTimeout(advance, WORD_DELAY);
  }

  window.addEventListener('load', () => {
    startCinematicLoader();
  });

  /* ───────────── resto: scroll, starfield, carousel ───────────── */

  function setScrollHeight() {
    scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
  }
  setScrollHeight();

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const norm = (v, a, b) => clamp((v - a) / (b - a), 0, 1);

  function frameIndexFor(scrollY) {
    if (scrollY >= S_SEQ_END) return FRAME_COUNT - 1;
    const progress = clamp(scrollY / S_SEQ_END, 0, 1);
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  function splitWords(text) {
    return text.split(' ').map(word => word.trim()).filter(Boolean);
  }

  function buildTextReveal() {
    revealLineEls.forEach((lineEl, lineIndex) => {
      const text = TEXT_LINES[lineIndex] || '';
      const words = splitWords(text);

      const ghost = lineEl.querySelector('.ghost-line');
      const fill = lineEl.querySelector('.fill-line');

      ghost.innerHTML = '';
      fill.innerHTML = '';

      words.forEach((word, wordIndex) => {
        const ghostWord = document.createElement('span');
        ghostWord.className = 'word';
        ghostWord.textContent = word;
        ghost.appendChild(ghostWord);

        const fillWord = document.createElement('span');
        fillWord.className = 'word';
        fillWord.textContent = word;
        fillWord.dataset.index = String(wordIndex);
        fillWord.dataset.line = String(lineIndex);
        fill.appendChild(fillWord);
      });
    });
  }

  buildTextReveal();

  const frames = Array.from({ length: FRAME_COUNT }, () => ({
    status: 0,
    img: null,
    promise: null
  }));

  let activeLayer = layerA;
  let hiddenLayer = layerB;
  let shownFrame = -1;
  let wantedFrame = 0;

  function swapTo(src) {
    if (hiddenLayer.src !== src) hiddenLayer.src = src;
    hiddenLayer.classList.add('active');
    activeLayer.classList.remove('active');
    const tmp = activeLayer;
    activeLayer = hiddenLayer;
    hiddenLayer = tmp;
  }

  function ensureFrame(index, priority = 'auto') {
    if (index < 0 || index >= FRAME_COUNT) return Promise.resolve(null);
    const item = frames[index];
    if (item.status === 2) return Promise.resolve(item.img);
    if (item.promise) return item.promise;

    item.status = 1;
    const img = new Image();
    img.decoding = 'async';
    img.fetchPriority = priority;
    img.src = frameSrc(index);

    item.promise = new Promise((resolve, reject) => {
      img.onload = async () => {
        try { if (img.decode) await img.decode(); } catch (e) {}
        item.status = 2;
        item.img = img;
        resolve(img);
      };
      img.onerror = () => {
        item.status = 3;
        reject(new Error(`Frame non trovato: ${frameSrc(index)}`));
      };
    }).finally(() => {
      item.promise = null;
      if (wantedFrame === index && frames[index].status === 2) {
        startLoop();
      }
    });

    return item.promise;
  }

  function warmFrames(center) {
    ensureFrame(center, 'high');
    ensureFrame(center + 1, 'high');
    ensureFrame(center - 1, 'high');
    ensureFrame(center + 2, 'auto');
    ensureFrame(center - 2, 'auto');
    ensureFrame(center + 3, 'auto');
    ensureFrame(center - 3, 'auto');
  }

  function showFrame(index) {
    index = clamp(index, 0, FRAME_COUNT - 1);
    wantedFrame = index;
    warmFrames(index);

    const item = frames[index];
    if (item.status !== 2 || !item.img) return;
    if (shownFrame === index) return;

    shownFrame = index;
    swapTo(item.img.currentSrc || item.img.src);
  }

  function preloadInitial() {
    for (let i = 0; i < Math.min(18, FRAME_COUNT); i++) {
      ensureFrame(i, 'high').catch(() => {});
    }
    let cursor = 18;
    function pump() {
      let count = 0;
      while (cursor < FRAME_COUNT && count < 4) {
        ensureFrame(cursor, 'auto').catch(() => {});
        cursor++;
        count++;
      }
      if (cursor < FRAME_COUNT) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(pump, { timeout: 120 });
        } else {
          setTimeout(pump, 40);
        }
      }
    }
    setTimeout(pump, 80);
  }

  const starState = {
    width: 0,
    height: 0,
    dpr: 1,
    stars: [],
    baseCx: 0,
    baseCy: 0,
    cx: 0,
    cy: 0,
    tx: 0,
    ty: 0,
    driftX: 0,
    driftY: 0,
    speed: 7.5,
    depth: 2200,
    focal: 420,
    lastTime: performance.now(),
    mouseSpeedFactor: 1
  };

  function createStar(randomZ = false) {
    const spread = Math.max(starState.width, starState.height) * 2.0;
    return {
      x: (Math.random() - 0.5) * spread,
      y: (Math.random() - 0.5) * spread,
      z: randomZ ? Math.random() * starState.depth + 1 : starState.depth,
      radius: Math.random() * 0.7 + 0.15,
      alpha: Math.random() * 0.55 + 0.25,
      twinkleOffset: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.025 + 0.008
    };
  }

  function resetStar(s) {
    const spread = Math.max(starState.width, starState.height) * 2.0;
    s.x = (Math.random() - 0.5) * spread;
    s.y = (Math.random() - 0.5) * spread;
    s.z = starState.depth;
    s.radius = Math.random() * 0.7 + 0.15;
    s.alpha = Math.random() * 0.55 + 0.25;
    s.twinkleOffset = Math.random() * Math.PI * 2;
    s.twinkleSpeed = Math.random() * 0.025 + 0.008;
  }

  function initStars() {
    starState.width = window.innerWidth;
    starState.height = window.innerHeight;
    starState.baseCx = starState.width * 0.5;
    starState.baseCy = starState.height * 0.5;
    starState.cx = starState.baseCx;
    starState.cy = starState.baseCy;
    starState.tx = starState.baseCx;
    starState.ty = starState.baseCy;
    const count = Math.max(260, Math.floor((starState.width * starState.height) / 5200));
    starState.stars = Array.from({ length: count }, () => createStar(true));
  }

  function resizeStarfield() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    starState.dpr = dpr;
    starCanvas.width = Math.floor(window.innerWidth * dpr);
    starCanvas.height = Math.floor(window.innerHeight * dpr);
    starCanvas.style.width = window.innerWidth + 'px';
    starCanvas.style.height = window.innerHeight + 'px';
    starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
  }

  function updatePointer(clientX, clientY) {
    const nx = clientX / starState.width - 0.5;
    const ny = clientY / starState.height - 0.5;

    const rangeX = starState.width * 0.16;
    const rangeY = starState.height * 0.16;

    starState.tx = starState.baseCx + nx * rangeX;
    starState.ty = starState.baseCy + ny * rangeY;
    starState.driftX = nx * 36;
    starState.driftY = ny * 36;

    const dist = Math.sqrt(nx * nx + ny * ny);
    starState.mouseSpeedFactor = 1 + dist * 0.55;
  }

  function drawStarfield(now) {
    const dt = Math.min(2, (now - starState.lastTime) / 16.6667 || 1);
    starState.lastTime = now;

    starState.cx += (starState.tx - starState.cx) * 0.055;
    starState.cy += (starState.ty - starState.cy) * 0.055;

    starCtx.fillStyle = "#000";
    starCtx.fillRect(0, 0, starState.width, starState.height);

    const time = now * 0.001;
    const speedBase = starState.speed;

    for (let i = 0; i < starState.stars.length; i++) {
      const s = starState.stars[i];
      const depthFactor = 1 + (1 - s.z / starState.depth) * 1.3;
      const mouseBoost = starState.mouseSpeedFactor || 1;
      s.z -= speedBase * depthFactor * mouseBoost * dt;

      if (s.z <= 1) {
        resetStar(s);
        continue;
      }

      const persp = starState.focal / s.z;
      const parallax = 1.4 - s.z / starState.depth;

      const x = starState.cx + (s.x + starState.driftX * parallax) * persp;
      const y = starState.cy + (s.y + starState.driftY * parallax) * persp;

      const prevZ = s.z + 22 * dt;
      const prevPersp = starState.focal / prevZ;
      const px = starState.cx + (s.x + starState.driftX * parallax) * prevPersp;
      const py = starState.cy + (s.y + starState.driftY * parallax) * prevPersp;

      if (x < -60 || x > starState.width + 60 || y < -60 || y > starState.height + 60) {
        resetStar(s);
        continue;
      }

      const proximity = 1 - s.z / starState.depth;
      const radius = Math.max(0.16, s.radius + proximity * 0.85);
      const twinkle = 0.8 + Math.sin(time * (2.2 + s.twinkleSpeed * 40) + s.twinkleOffset) * 0.2;
      const alpha = Math.min(1, (s.alpha + proximity * 0.32) * twinkle);

      starCtx.beginPath();
      starCtx.strokeStyle = `rgba(255,255,255,${alpha * 0.22})`;
      starCtx.lineWidth = Math.max(0.18, radius * 0.55);
      starCtx.moveTo(px, py);
      starCtx.lineTo(x, y);
      starCtx.stroke();

      starCtx.beginPath();
      starCtx.fillStyle = `rgba(255,255,255,${alpha})`;
      starCtx.arc(x, y, radius, 0, Math.PI * 2);
      starCtx.fill();
    }

    requestAnimationFrame(drawStarfield);
  }

  function updateTextReveal(scrollY) {
    const overlayIn = S_FADE_END + 60;
    const overlayOut = TEXT_VISIBLE_END;
    const overlayVisible = scrollY >= overlayIn && scrollY <= overlayOut;
    textOverlay.classList.toggle('is-visible', overlayVisible);

    const revealStart = S_FADE_END + 120;
    const revealEnd = TEXT_VISIBLE_END;
    const globalProgress = norm(scrollY, revealStart, revealEnd);

    revealLineEls.forEach((lineEl, lineIndex) => {
      const fillWords = [...lineEl.querySelectorAll('.fill-line .word')];
      const total = fillWords.length;

      const linesCount = revealLineEls.length;
      const lineStart = lineIndex / linesCount;
      const lineEnd = (lineIndex + 1) / linesCount;
      const lineProgress = clamp((globalProgress - lineStart) / (lineEnd - lineStart), 0, 1);

      fillWords.forEach((wordEl, wordIndex) => {
        const wordSpan = 1 / total;
        const wordStart = wordIndex * wordSpan;
        const wordEnd = wordStart + wordSpan * 0.72;
        const t = clamp((lineProgress - wordStart) / (wordEnd - wordStart), 0, 1);

        const gray = 78;
        const white = 255;
        const ch = Math.round(gray + (white - gray) * t);

        wordEl.style.color = `rgb(${ch}, ${ch}, ${ch})`;
        wordEl.style.opacity = String(0.18 + t * 0.82);
        wordEl.style.filter = `blur(${(1 - t) * 1.55}px)`;
        wordEl.style.transform = `translateY(${(1 - t) * 5}px)`;
      });

      const lineShown = lineProgress > 0.01;
      lineEl.style.opacity = String(lineShown ? (0.28 + lineProgress * 0.72) : 0.2);
      lineEl.style.transform = `translateY(${Math.max(0, 12 - lineProgress * 12)}px)`;
    });
  }

  function updateSpatialCarousel(scrollY) {
    const visibleIn = S_SPATIAL_START + 10;
    const visibleOut = S_SPATIAL_END + 140;
    const visible = scrollY >= visibleIn && scrollY <= visibleOut;
    spatialOverlay.classList.toggle('is-visible', visible);

    const progress = norm(scrollY, S_SPATIAL_START, S_SPATIAL_END);

    const entryOffset = 1.05;
    const activeIndex = -entryOffset + progress * (SPATIAL_ITEM_COUNT - 1 + entryOffset);

    const isMobile = window.innerWidth <= 768;

    const hSpread = isMobile ? window.innerWidth * 0.66 : window.innerWidth * 0.34;
    const vGap = isMobile ? window.innerHeight * 0.40 : window.innerHeight * 0.34;
    const leftCompression = 0.56;
    const focusLift = isMobile ? 16 : 10;
    const rotateStep = isMobile ? -5.5 : -6.5;
    const zStep = isMobile ? 135 : 150;
    const scaleDrop = 0.108;
    const fadeDrop = 0.19;
    const maxDepth = 4.25;

    spatialCards.forEach((card, i) => {
      const delta = i - activeIndex;
      const abs = Math.abs(delta);
      const d = Math.min(abs, maxDepth);

      const sideFactor = delta >= 0 ? 1 : leftCompression;

      const x = delta * hSpread * sideFactor;
      const yBase = delta * vGap;
      const yCurve = -Math.pow(Math.min(d, 2.6) / 2.6, 1.22) * (isMobile ? 28 : 22);
      const y = yBase + yCurve - focusLift;

      const scale = Math.max(0.48, 1 - d * scaleDrop);
      const opacity = Math.max(0, 1 - d * fadeDrop);
      const blur = d < 0.12 ? 0 : Math.min(4.6, (d - 0.12) * 1.08);
      const rotate = delta * rotateStep;
      const z = 360 - d * zStep;

      card.style.zIndex = String(2200 - Math.round(d * 100) - i);
      card.style.opacity = opacity < 0.015 ? '0' : opacity.toFixed(3);
      card.style.filter = `blur(${blur.toFixed(2)}px)`;
      card.style.transform =
        `translate3d(calc(-50% + ${x.toFixed(2)}px), calc(-50% + ${y.toFixed(2)}px), ${z.toFixed(2)}px) ` +
        `scale(${scale.toFixed(4)}) rotateZ(${rotate.toFixed(2)}deg)`;

      const shadow = spatialShadows[i];
      if (shadow) {
        const shadowOpacity = Math.max(0, 0.19 - d * 0.036) * opacity;
        const shadowX = x * 0.14;
        const shadowY = y * 0.04;
        const shadowScale = 0.78 + scale * 0.24;
        shadow.style.opacity = shadowOpacity < 0.01 ? '0' : shadowOpacity.toFixed(3);
        shadow.style.transform =
          `translateX(calc(-50% + ${shadowX.toFixed(2)}px)) translateY(${shadowY.toFixed(2)}px) scale(${shadowScale.toFixed(3)})`;
      }
    });
  }

  let targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  let currentScrollY = targetScrollY;
  let running = false;
  let rafId = 0;

  function render(scrollY) {
    const frameIdx = frameIndexFor(scrollY);
    showFrame(frameIdx);

    if (scrollY < S_SEQ_END) {
      overlay.style.opacity = '0';
      layerA.classList.remove('hidden-after-fade');
      layerB.classList.remove('hidden-after-fade');
      textOverlay.classList.remove('is-visible');
      spatialOverlay.classList.remove('is-visible');
    } else if (scrollY < S_FADE_END) {
      const fadeT = norm(scrollY, S_SEQ_END, S_FADE_END);
      overlay.style.opacity = fadeT.toFixed(3);
      textOverlay.classList.remove('is-visible');
      spatialOverlay.classList.remove('is-visible');
    } else {
      overlay.style.opacity = '0';
      layerA.classList.add('hidden-after-fade');
      layerB.classList.add('hidden-after-fade');
    }

    updateTextReveal(scrollY);
    updateSpatialCarousel(scrollY);
  }

  function loop() {
    const delta = targetScrollY - currentScrollY;
    const ease = Math.abs(delta) > 140 ? 0.115 : 0.135;

    if (Math.abs(delta) > 0.1) {
      currentScrollY += delta * ease;
    } else {
      currentScrollY = targetScrollY;
    }

    render(currentScrollY);

    const stillMoving = Math.abs(targetScrollY - currentScrollY) > 0.1;
    const waitingForFrame = frames[wantedFrame]?.status !== 2;

    if (stillMoving || waitingForFrame) {
      rafId = requestAnimationFrame(loop);
    } else {
      running = false;
      rafId = 0;
      render(targetScrollY);
    }
  }

  function startLoop() {
    if (running) return;
    running = true;
    rafId = requestAnimationFrame(loop);
  }

  window.addEventListener('scroll', () => {
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    startLoop();
  }, { passive: true });

  window.addEventListener('resize', () => {
    setScrollHeight();
    buildTextReveal();
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    currentScrollY = targetScrollY;
    resizeStarfield();
    render(currentScrollY);
    startLoop();
  }, { passive: true });

  window.addEventListener('mousemove', e => {
    updatePointer(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (!e.touches[0]) return;
    updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('mouseleave', () => {
    starState.tx = starState.baseCx;
    starState.ty = starState.baseCy;
    starState.driftX = 0;
    starState.driftY = 0;
    starState.mouseSpeedFactor = 1;
  });

  preloadInitial();

  ensureFrame(0, 'high')
    .then(img => {
      layerA.src = img.currentSrc || img.src;
      shownFrame = 0;
      wantedFrame = 0;
      render(currentScrollY);
    })
    .catch(() => {
      render(currentScrollY);
    });

  resizeStarfield();
  requestAnimationFrame(drawStarfield);
</script>

</body>
</html>
