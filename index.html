<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Sequence + Porta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; }

    #scroll-space { /* altezza impostata via JS */ }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    #sequence {
      position: absolute;
      display: block;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
    }

    /* ── PORTA + TUNNEL ───────────────────────── */
    #door-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    #door-wrapper {
      position: relative;
      width: 360px;
      height: 520px;
      transform-origin: center center;
      transform: scale(0.1);
    }

    #door-svg {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 2;
    }

    #door-tunnel {
      position: absolute;
      top: 16%;
      left: 23%;
      width: 54%;
      height: 64%;
      background: #6fb0e6;
      overflow: hidden;
      perspective: 900px;
      z-index: 1;
    }

    #tunnel-inner {
      position: absolute;
      inset: -60% -60%;
      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .tunnel-word {
      position: absolute;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      color: #f5f7ff;
      white-space: nowrap;
      line-height: 1;
      user-select: none;
      transform-origin: center center;
    }

    /* ═══════════════════════════════
       PRELOADER "GABRIELE"
    ═══════════════════════════════ */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #a9acb6; /* come var(--loader-bg) di prima */
      opacity: 1;
      visibility: visible;
      transition:
        opacity 900ms ease,
        visibility 900ms ease;
    }

    #preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-text-wrap {
      display: flex;
      gap: 0.45rem;
      font-family: "Playfair Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      letter-spacing: 0.22em;
      color: #111;
    }

    .loader-letter {
      position: relative;
      display: inline-block;
      text-transform: uppercase;
      color: #111111;
      text-shadow:
        0 0.04em 0 rgba(255,255,255,0.5),
        0 0.06em 0 rgba(0,0,0,0.24);
      animation: letterBounce 1.1s ease-in-out infinite;
    }

    .loader-letter:nth-child(1) { animation-delay: 0s;    }
    .loader-letter:nth-child(2) { animation-delay: 0.10s; }
    .loader-letter:nth-child(3) { animation-delay: 0.20s; }
    .loader-letter:nth-child(4) { animation-delay: 0.30s; }
    .loader-letter:nth-child(5) { animation-delay: 0.40s; }
    .loader-letter:nth-child(6) { animation-delay: 0.50s; }
    .loader-letter:nth-child(7) { animation-delay: 0.60s; }
    .loader-letter:nth-child(8) { animation-delay: 0.70s; }

    @keyframes letterBounce {
      0%   { transform: translateY(0)    scale(1);      opacity: 0.40; }
      25%  { transform: translateY(-8px) scale(1);      opacity: 1;    }
      50%  { transform: translateY(0)    scale(1);      opacity: 0.9;  }
      75%  { transform: translateY(3px)  scale(1.02);   opacity: 0.85; }
      100% { transform: translateY(0)    scale(1.04);   opacity: 1;    }
    }
  </style>
</head>
<body>

<!-- PRELOADER SOLO TESTO -->
<div id="preloader" aria-hidden="true">
  <div class="loader-text-wrap">
    <span class="loader-letter">G</span>
    <span class="loader-letter">A</span>
    <span class="loader-letter">B</span>
    <span class="loader-letter">R</span>
    <span class="loader-letter">I</span>
    <span class="loader-letter">E</span>
    <span class="loader-letter">L</span>
    <span class="loader-letter">E</span>
  </div>
</div>

<div id="scroll-space"></div>

<div id="stage">
  <canvas id="sequence"></canvas>
  <div id="fade-overlay"></div>

  <!-- PORTA + TUNNEL -->
  <div id="door-scene">
    <div id="door-wrapper">

      <div id="door-tunnel">
        <div id="tunnel-inner"></div>
      </div>

      <svg id="door-svg" viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="360" height="520" fill="#000" />
        <rect x="20" y="20" width="320" height="480" fill="#f5f5f5" />
        <rect x="36" y="36" width="288" height="448" fill="#e9e9e9" />
        <rect x="180" y="36" width="2" height="448" fill="#d0d0d0" />

        <g id="door-left" style="transform-origin: 36px 260px; transform-box: fill-box;">
          <rect x="36" y="36" width="144" height="448" fill="#fdfdfd" />
          <rect x="48" y="52" width="120" height="416" fill="#f2f2f2" />
          <rect x="56" y="60" width="104" height="400" fill="#fdfdfd" />
          <rect x="160" y="246" width="8" height="32" rx="4" fill="#d0d0d0" />
        </g>

        <g id="door-right" style="transform-origin: 324px 260px; transform-box: fill-box;">
          <rect x="196" y="36" width="144" height="448" fill="#fdfdfd" />
          <rect x="208" y="52" width="120" height="416" fill="#f2f2f2" />
          <rect x="216" y="60" width="104" height="400" fill="#fdfdfd" />
          <rect x="196" y="246" width="8" height="32" rx="4" fill="#d0d0d0" />
        </g>

        <rect x="20" y="20" width="320" height="480" fill="none" stroke="#d0d0d0" stroke-width="2" />
      </svg>

    </div>
  </div>

</div>

<script>
/* ───────────────── CONFIG GENERALE ───────────────── */

const FRAME_COUNT  = 127;
const PX_PER_FRAME = 18;
const FADE_PX      = 250;
const DOOR_ZOOM_PX = 1200;
const DOOR_OPEN_PX = 600;
const TUNNEL_PX    = 900;

const TOTAL_PX = (FRAME_COUNT * PX_PER_FRAME) + FADE_PX + DOOR_ZOOM_PX + DOOR_OPEN_PX + TUNNEL_PX;

const frameSrc = i => `img-sequence/${String(i + 2).padStart(3, '0')}.png`;

const S_SEQ_END   = FRAME_COUNT * PX_PER_FRAME;
const S_FADE_END  = S_SEQ_END + FADE_PX;
const S_ZOOM_END  = S_FADE_END + DOOR_ZOOM_PX;
const S_OPEN_END  = S_ZOOM_END + DOOR_OPEN_PX;
const S_TUNN_END  = S_OPEN_END + TUNNEL_PX;

/* ───────────────── SCROLL SPACE ─────────────────── */
const scrollSpace = document.getElementById('scroll-space');
function setScrollHeight() {
  scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
}
setScrollHeight();

/* ───────────────── CANVAS SEQUENZA ──────────────── */
const canvas  = document.getElementById('sequence');
const ctx     = canvas.getContext('2d');
let natW = 1920, natH = 1080;

function applyCanvasCover() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const ir = natW / natH;
  const vr = vw / vh;
  let dw, dh;
  if (vr > ir) { dw = vw; dh = vw / ir; }
  else { dh = vh; dw = vh * ir; }
  dw = Math.round(dw); dh = Math.round(dh);
  canvas.width = dw; canvas.height = dh;
  canvas.style.left = Math.round((vw - dw) / 2) + 'px';
  canvas.style.top  = Math.round((vh - dh) / 2) + 'px';
  canvas.style.width  = dw + 'px';
  canvas.style.height = dh + 'px';
}

const images = new Array(FRAME_COUNT);
let loadedCount = 0;
let firstLoaded = false;

function loadFrame(i) {
  const img = new Image();
  img.fetchPriority = i < 10 ? 'high' : 'auto';
  img.src = frameSrc(i);
  img.onload = function () {
    loadedCount++;
    if (!firstLoaded) {
      firstLoaded = true;
      natW = img.naturalWidth || natW;
      natH = img.naturalHeight || natH;
      applyCanvasCover();
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
  };
  img.onerror = function() {
    console.warn(`Frame ${i + 2} non trovato: ${frameSrc(i)}`);
  };
  images[i] = img;
}

for (let i = 0; i < FRAME_COUNT; i++) {
  loadFrame(i);
}

/* ───────────────── TUNNEL PAROLE ────────────────── */
const WORDS = [
  { text: 'GABRJMAD', size: 130, x: 5,   y: 10,  rot: -5  },
  { text: 'DESIGNER', size: 90,  x: 55,  y: 18,  rot: 8   },
  { text: 'INVESTOR', size: 110, x: 10,  y: 40,  rot: -8  },
  { text: 'BUISNESS', size: 100, x: 55,  y: 45,  rot: 7   },
  { text: 'MODEL',    size: 140, x: 0,   y: 60,  rot: -10 },
  { text: 'ROUND',    size: 95,  x: 60,  y: 68,  rot: 6   },
  { text: 'FRONT',    size: 120, x: 8,   y: 78,  rot: -7  },
  { text: 'BELLO',    size: 105, x: 58,  y: 82,  rot: 9   },
  { text: 'GABRJMAD', size: 70,  x: -5,  y: 28,  rot: 4   },
  { text: 'DESIGNER', size: 150, x: 25,  y: 52,  rot: -4  },
];

const tunnelInner = document.getElementById('tunnel-inner');
WORDS.forEach(w => {
  const el = document.createElement('div');
  el.className = 'tunnel-word';
  el.textContent = w.text;
  el.style.fontSize = w.size + 'px';
  el.style.left = w.x + '%';
  el.style.top  = w.y + '%';
  el.style.transform = `rotate(${w.rot}deg)`;
  tunnelInner.appendChild(el);
});

/* ───────────────── DOM ELEMENTS ─────────────────── */
const overlay     = document.getElementById('fade-overlay');
const doorScene   = document.getElementById('door-scene');
const doorWrapper = document.getElementById('door-wrapper');
const doorLeft    = document.getElementById('door-left');
const doorRight   = document.getElementById('door-right');

/* ───────────────── HELPERS ─────────────────────── */
function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
function norm(v, a, b)      { return clamp((v - a) / (b - a), 0, 1); }
function ease(t)            { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }

/* ───────────────── SCROLL LOGIC ─────────────────── */
let lastFrameIdx = -1;

function redraw() {
  const sy = window.scrollY || document.documentElement.scrollTop || 0;

  const frameIdx = clamp(Math.floor(sy / PX_PER_FRAME), 0, FRAME_COUNT - 1);
  if (frameIdx !== lastFrameIdx) {
    lastFrameIdx = frameIdx;
    const img = images[frameIdx];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }
  }

  const fadeT = norm(sy, S_SEQ_END, S_FADE_END);
  overlay.style.opacity = fadeT.toFixed(4);

  if (sy < S_FADE_END) {
    doorScene.style.opacity = '0';
    return;
  }

  doorScene.style.opacity = '1';

  const zoomT = ease(norm(sy, S_FADE_END, S_TUNN_END));
  const scale = 0.08 + zoomT * 3.2;
  doorWrapper.style.transform = `scale(${scale.toFixed(4)})`;

  const openT = ease(norm(sy, S_FADE_END, S_OPEN_END));
  const leftDeg  = -85 * openT;
  const rightDeg =  85 * openT;
  doorLeft.style.transform  = `perspective(900px) rotateY(${leftDeg.toFixed(2)}deg)`;
  doorRight.style.transform = `perspective(900px) rotateY(${rightDeg.toFixed(2)}deg)`;

  const tunnelT = ease(norm(sy, S_ZOOM_END, S_TUNN_END));
  const rotX = -20 - 70 * tunnelT;
  const translateZ = -400 + 400 * tunnelT;
  tunnelInner.style.transform = `translateZ(${translateZ}px) rotateX(${rotX}deg)`;
}

window.addEventListener('scroll', () => requestAnimationFrame(redraw), { passive: true });
window.addEventListener('resize', () => { setScrollHeight(); applyCanvasCover(); redraw(); });

applyCanvasCover();
redraw();

/* ───────────────── HIDE PRELOADER DOPO AVVIO ───────────────── */
/* preloader molto semplice: scompare dopo un minimo tempo + primo frame */
const preloader = document.getElementById('preloader');
function hidePreloader() {
  preloader.classList.add('is-hidden');
}

window.addEventListener('load', () => {
  // piccolo delay per far vedere l'animazione delle lettere
  setTimeout(hidePreloader, 1200);
});
</script>

</body>
</html>
