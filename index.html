<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scroll Sequence + Porta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">

  <style>
    :root {
      --loader-bg: #a9acb6;
      --loader-fg: #ffffff;
      --loader-out: 900ms;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      overscroll-behavior: none;
    }

    body { min-height: 100vh; }
    body.is-loading { overflow: hidden; }

    #scroll-space {}

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 900ms ease, transform 1200ms ease;
    }

    body.is-ready #stage {
      opacity: 1;
      transform: scale(1);
    }

    .seq-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .seq-layer.active { opacity: 1; }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
      z-index: 2;
    }

    /* ═══════════════════════════════
       PORTA — versione definitiva
    ═══════════════════════════════ */

    #door-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      /* NO perspective qui: applicata per-anta in JS */
    }

    #door-wrapper {
      position: relative;
      width: 400px;
      height: 560px;
      transform-origin: center center;
      transform: scale(0.08);
      will-change: transform;
      /* NO transform-style: preserve-3d sul wrapper:
         evita che il contesto 3D padre interferisca */
    }

    /* Sfondo ambrato visibile quando le ante si aprono */
    #door-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 38%,
          #f0e0b0 0%,
          #c09828 18%,
          #6b4808 40%,
          #1a0f02 65%,
          #000000 100%);
    }

    /* Ogni anta è un div con SVG dentro */
    .door-leaf {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 2;
      /* CRITICO: backface nascosta → l'anta oltre 90° diventa
         invisibile invece di mostrare il retro */
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      overflow: hidden;
    }

    .door-leaf svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .door-leaf-left  {
      left: 0;
      transform-origin: 0% 50%;    /* cardine sinistro */
    }

    .door-leaf-right {
      right: 0;
      transform-origin: 100% 50%;  /* cardine destro */
    }

    /* Cornice SVG sovrapposta ad entrambe le ante */
    #door-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      overflow: visible;
    }

    /* ── responsive ── */
    @media (max-width: 768px) {
      #door-wrapper { width: 280px; height: 392px; }
    }
    @media (max-width: 480px) {
      #door-wrapper { width: 230px; height: 322px; }
    }
    @media (max-aspect-ratio: 9/16) {
      #door-wrapper { width: 260px; height: 364px; }
    }

    /* ═══════════════════════════════
       PRELOADER
    ═══════════════════════════════ */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--loader-bg);
      opacity: 1;
      visibility: visible;
      transition:
        opacity var(--loader-out) ease,
        visibility var(--loader-out) ease;
    }

    #preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-wrap {
      position: relative;
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      transform: scale(0.88);
      animation: loaderAppear 900ms ease forwards;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      animation: rotateRing 2.8s linear infinite;
    }

    .loader-segment {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 2px;
      border-radius: 999px;
      background: var(--loader-fg);
      transform-origin: -22px center;
      opacity: 0.16;
      animation: pulseSeg 1.08s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .loader-center {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(255,255,255,0.20);
      animation: centerBreath 1.6s ease-in-out infinite;
    }

    .loader-segment:nth-child(1)  { transform: translate(-50%,-50%) rotate(0deg);   animation-delay: 0s; }
    .loader-segment:nth-child(2)  { transform: translate(-50%,-50%) rotate(30deg);  animation-delay: .08s; }
    .loader-segment:nth-child(3)  { transform: translate(-50%,-50%) rotate(60deg);  animation-delay: .16s; }
    .loader-segment:nth-child(4)  { transform: translate(-50%,-50%) rotate(90deg);  animation-delay: .24s; }
    .loader-segment:nth-child(5)  { transform: translate(-50%,-50%) rotate(120deg); animation-delay: .32s; }
    .loader-segment:nth-child(6)  { transform: translate(-50%,-50%) rotate(150deg); animation-delay: .40s; }
    .loader-segment:nth-child(7)  { transform: translate(-50%,-50%) rotate(180deg); animation-delay: .48s; }
    .loader-segment:nth-child(8)  { transform: translate(-50%,-50%) rotate(210deg); animation-delay: .56s; }
    .loader-segment:nth-child(9)  { transform: translate(-50%,-50%) rotate(240deg); animation-delay: .64s; }
    .loader-segment:nth-child(10) { transform: translate(-50%,-50%) rotate(270deg); animation-delay: .72s; }
    .loader-segment:nth-child(11) { transform: translate(-50%,-50%) rotate(300deg); animation-delay: .80s; }
    .loader-segment:nth-child(12) { transform: translate(-50%,-50%) rotate(330deg); animation-delay: .88s; }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes pulseSeg {
      0%, 100% { opacity: 0.12; filter: blur(0px); }
      50%      { opacity: 1;    filter: blur(0.2px); }
    }
    @keyframes centerBreath {
      0%, 100% { transform: scale(0.75); opacity: 0.6; }
      50%      { transform: scale(1);    opacity: 1; }
    }
    @keyframes loaderAppear {
      from { opacity: 0; transform: scale(0.72); }
      to   { opacity: 1; transform: scale(0.88); }
    }
  </style>
</head>

      <span class="loader-segment"></span>

      <span class="loader-segment"></span>
      <span class="loader-segment"></span>

    <div class="loader-center"></div>

      <!-- Cornice in legno dorato sovrapposta -->

        <defs>

        <!-- Cornice left -->
        <rect x="0"   y="0"   width="28"  height="560" fill="url(#frv)"/>
        <rect x="0"   y="0"   width="2"   height="560" fill="rgba(255,228,138,.52)"/>
        <rect x="26"  y="0"   width="4"   height="560" fill="rgba(0,0,0,.28)"/>

        <!-- Cornice right -->
        <rect x="372" y="0"   width="28"  height="560" fill="url(#frv)"/>
        <rect x="398" y="0"   width="2"   height="560" fill="rgba(0,0,0,.48)"/>
        <rect x="370" y="0"   width="4"   height="560" fill="rgba(0,0,0,.24)"/>

        <!-- Montante centrale -->
        <rect x="186" y="28"  width="28"  height="504" fill="url(#frv)"/>
        <rect x="186" y="28"  width="1"   height="504" fill="rgba(255,228,138,.34)"/>
        <rect x="213" y="28"  width="1"   height="504" fill="rgba(0,0,0,.34)"/>

        <!-- Ombra interna superiore (profondità) -->
        <rect x="28"  y="28"  width="344" height="14" fill="rgba(0,0,0,.28)"/>
        <!-- Luce interna superiore -->
        <rect x="28"  y="28"  width="344" height="3"  fill="rgba(255,220,110,.18)"/>
      </svg>

    </div>
  </div>
</div>

<script>
  /* ───────────────── PRELOADER CONFIG ───────────────── */
  const MIN_LOADER_TIME = 1800;
  const MAX_LOADER_TIME = 7000;

  /* ───────────────── CONFIG ───────────────── */
  const FRAME_COUNT  = 127;
  const PX_PER_FRAME = window.innerWidth <= 768 ? 30 : 24;
  const FADE_PX      = 420;

  const DOOR_APPROACH_PX = 1500;
  const DOOR_ENTER_PX    = 900;

  const S_SEQ_END  = (FRAME_COUNT - 1) * PX_PER_FRAME;
  const S_FADE_END = S_SEQ_END + FADE_PX;
  const S_OPEN_END = S_FADE_END + DOOR_APPROACH_PX;   /* ante completamente aperte */
  const S_TUNN_END = S_OPEN_END + DOOR_ENTER_PX;      /* dentro la porta */
  const TOTAL_PX   = S_TUNN_END;

  const frameSrc = i =>
    `img-sequence/compressed_${String(i + 2).padStart(3, '0')}.jpg`;

  /* ───────────────── DOM ───────────────── */
  const body        = document.body;
  const preloader   = document.getElementById('preloader');
  const scrollSpace = document.getElementById('scroll-space');
  const layerA      = document.getElementById('seq-a');
  const layerB      = document.getElementById('seq-b');
  const overlay     = document.getElementById('fade-overlay');
  const doorScene   = document.getElementById('door-scene');
  const doorWrapper = document.getElementById('door-wrapper');
  const doorLeft    = document.getElementById('door-left');
  const doorRight   = document.getElementById('door-right');

  function setScrollHeight() {
    scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
  }
  setScrollHeight();

  /* ───────────────── HELPERS ───────────────── */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const norm  = (v, a, b) => clamp((v - a) / (b - a), 0, 1);

  /* easeOutCubic — decelerazione naturale (fisica reale della porta) */
  const easeOut3  = t => 1 - Math.pow(1 - t, 3);
  /* easeInOutCubic — zoom cinematico */
  const easeIO3   = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

  function frameIndexFor(scrollY) {
    if (scrollY >= S_SEQ_END) return FRAME_COUNT - 1;
    const progress = clamp(scrollY / S_SEQ_END, 0, 1);
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  /* ───────────────── FRAME CACHE ───────────────── */
  const frames = Array.from({ length: FRAME_COUNT }, () => ({
    status: 0, img: null, promise: null
  }));

  let activeLayer = layerA;
  let hiddenLayer = layerB;
  let shownFrame  = -1;
  let wantedFrame = 0;

  function swapTo(src) {
    if (hiddenLayer.src !== src) hiddenLayer.src = src;
    hiddenLayer.classList.add('active');
    activeLayer.classList.remove('active');
    const tmp = activeLayer;
    activeLayer = hiddenLayer;
    hiddenLayer = tmp;
  }

  function ensureFrame(index, priority = 'auto') {
    if (index < 0 || index >= FRAME_COUNT) return Promise.resolve(null);
    const item = frames[index];
    if (item.status === 2) return Promise.resolve(item.img);
    if (item.promise) return item.promise;
    item.status = 1;
    const img = new Image();
    img.decoding = 'async';
    img.fetchPriority = priority;
    img.src = frameSrc(index);
    item.promise = new Promise((resolve, reject) => {
      img.onload = async () => {
        try { if (img.decode) await img.decode(); } catch (e) {}
        item.status = 2;
        item.img = img;
        resolve(img);
      };
      img.onerror = () => {
        item.status = 3;
        reject(new Error(`Frame non trovato: ${frameSrc(index)}`));
      };
    }).finally(() => {
      item.promise = null;
      if (wantedFrame === index && frames[index].status === 2) startLoop();
    });
    return item.promise;
  }

  function warmFrames(center) {
    ensureFrame(center,     'high');
    ensureFrame(center + 1, 'high');
    ensureFrame(center - 1, 'high');
    ensureFrame(center + 2, 'auto');
    ensureFrame(center - 2, 'auto');
    ensureFrame(center + 3, 'auto');
    ensureFrame(center - 3, 'auto');
    ensureFrame(center + 4, 'auto');
    ensureFrame(center - 4, 'auto');
  }

  function showFrame(index) {
    index = clamp(index, 0, FRAME_COUNT - 1);
    wantedFrame = index;
    warmFrames(index);
    const item = frames[index];
    if (item.status !== 2 || !item.img) return;
    if (shownFrame === index) return;
    shownFrame = index;
    swapTo(item.img.currentSrc || item.img.src);
  }

  function preloadInitial() {
    for (let i = 0; i < Math.min(18, FRAME_COUNT); i++) {
      ensureFrame(i, 'high').catch(() => {});
    }
    let cursor = 18;
    function pump() {
      let count = 0;
      while (cursor < FRAME_COUNT && count < 4) {
        ensureFrame(cursor, 'auto').catch(() => {});
        cursor++; count++;
      }
      if (cursor < FRAME_COUNT) {
        if ('requestIdleCallback' in window)
          requestIdleCallback(pump, { timeout: 120 });
        else setTimeout(pump, 40);
      }
    }
    setTimeout(pump, 80);
  }

  /* ───────────────── PRELOADER HELPERS ───────────────── */
  function waitForFonts() {
    if (!document.fonts || !document.fonts.ready) return Promise.resolve();
    return document.fonts.ready.catch(() => Promise.resolve());
  }
  const minDelay = ms => new Promise(r => setTimeout(r, ms));
  const timeout  = ms => new Promise(r => setTimeout(r, ms));

  function hidePreloader() {
    preloader.classList.add('is-hidden');
    body.classList.remove('is-loading');
    body.classList.add('is-ready');
  }

  /* ─────────────────────────────────────────────────────
     PORTA — renderDoorSequence
     
     Regole critiche:
     1. perspective() nella stringa transform di OGNI ANTA,
        non sul padre → prospettiva indipendente per ciascuna
     2. backface-visibility:hidden sul .door-leaf in CSS →
        l'anta sparisce naturalmente a 90° senza artefatti
     3. Zoom (S_FADE_END → S_TUNN_END) più lungo dell'apertura
        (S_FADE_END → S_OPEN_END) → le ante sono già aperte
        quando ci entri fisicamente
  ───────────────────────────────────────────────────── */
  const PERSP_PX = 1800;

  function renderDoorSequence(scrollY) {
    if (scrollY < S_SEQ_END) {
      doorScene.style.opacity = '0';
      return;
    }

    /* Apparizione graduale durante il fade nero */
    const revealT = norm(scrollY, S_SEQ_END, S_FADE_END);
    doorScene.style.opacity = revealT.toFixed(3);

    if (scrollY < S_FADE_END) return;

    /* Zoom: da 0.08 a 4.8 — a 4.8 la porta è 400*4.8=1920px,
       copre ampiamente qualsiasi schermo → effetto "ci entro" */
    const zoomT  = easeIO3(norm(scrollY, S_FADE_END, S_TUNN_END));
    const scale  = 0.08 + zoomT * 4.72;
    const transY = 28 * (1 - zoomT);  /* sale leggermente mentre si avvicina */
    doorWrapper.style.transform =
      `translate(0, ${transY.toFixed(1)}px) scale(${scale.toFixed(4)})`;

    /* Apertura ante: 0° → 90°
       easeOut3 → decelerazione naturale come una porta fisica */
    const openT = easeOut3(norm(scrollY, S_FADE_END, S_OPEN_END));
    const deg   = 90 * openT;

    /* perspective() PER ANTA → rotazione corretta e simmetrica */
    doorLeft.style.transform  =
      `perspective(${PERSP_PX}px) rotateY(${(-deg).toFixed(2)}deg)`;
    doorRight.style.transform =
      `perspective(${PERSP_PX}px) rotateY(${deg.toFixed(2)}deg)`;
  }

  /* ───────────────── SMOOTH RENDER LOOP ───────────────── */
  let targetScrollY  = window.scrollY || document.documentElement.scrollTop || 0;
  let currentScrollY = targetScrollY;
  let running        = false;

  function render(scrollY) {
    showFrame(frameIndexFor(scrollY));
    overlay.style.opacity = norm(scrollY, S_SEQ_END, S_FADE_END).toFixed(3);
    renderDoorSequence(scrollY);
  }

  function loop() {
    const delta = targetScrollY - currentScrollY;
    if (Math.abs(delta) > 0.15) currentScrollY += delta * 0.22;
    else currentScrollY = targetScrollY;
    render(currentScrollY);
    const stillMoving    = Math.abs(targetScrollY - currentScrollY) > 0.15;
    const waitingForFrame = frames[wantedFrame]?.status !== 2;
    if (stillMoving || waitingForFrame) requestAnimationFrame(loop);
    else { running = false; render(targetScrollY); }
  }

  function startLoop() {
    if (running) return;
    running = true;
    requestAnimationFrame(loop);
  }

  /* ───────────────── EVENTS ───────────────── */
  window.addEventListener('scroll', () => {
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    startLoop();
  }, { passive: true });

  window.addEventListener('resize', () => {
    setScrollHeight();
    targetScrollY  = window.scrollY || document.documentElement.scrollTop || 0;
    currentScrollY = targetScrollY;
    startLoop();
  }, { passive: true });

  /* ───────────────── INIT ───────────────── */
  async function init() {
    preloadInitial();
    const firstFramePromise = ensureFrame(0, 'high')
      .then(img => {
        layerA.src = img.currentSrc || img.src;
        shownFrame = 0; wantedFrame = 0;
        render(currentScrollY);
      })
      .catch(() => render(currentScrollY));

    await Promise.race([
      Promise.all([firstFramePromise, waitForFonts(), minDelay(MIN_LOADER_TIME)]),
      timeout(MAX_LOADER_TIME)
    ]);

    hidePreloader();
    startLoop();
  }

  window.addEventListener('load', init, { once: true });
</script>

</body>
</html>
