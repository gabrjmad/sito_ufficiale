<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scroll Sequence + Porta</title>

  //fonts.googleapis.com">
  //fonts.gstatic.com" crossorigin>
  //fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">

  <style>
    :root {
      --loader-bg: #a9acb6;
      --loader-fg: #ffffff;
      --loader-out: 900ms;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
    }

    body.is-loading {
      overflow: hidden;
    }

    #scroll-space {}

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 900ms ease, transform 1200ms ease;
    }

    body.is-ready #stage {
      opacity: 1;
      transform: scale(1);
    }

    .seq-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background: #000;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .seq-layer.active {
      opacity: 1;
    }

    #fade-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }

    #door-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    #door-wrapper {
      position: relative;
      width: 360px;
      height: 520px;
      transform-origin: center center;
      transform: scale(0.1);
      will-change: transform;
    }

    #door-svg {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 2;
    }

    #door-tunnel {
      position: absolute;
      top: 16%;
      left: 23%;
      width: 54%;
      height: 64%;
      background: #6fb0e6;
      overflow: hidden;
      perspective: 900px;
      z-index: 1;
    }

    #tunnel-inner {
      position: absolute;
      inset: -60% -60%;
      transform-style: preserve-3d;
      transform-origin: center center;
      will-change: transform;
    }

    .tunnel-word {
      position: absolute;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      color: #f5f7ff;
      white-space: nowrap;
      line-height: 1;
      user-select: none;
      transform-origin: center center;
    }

    #door-left,
    #door-right {
      will-change: transform;
    }

    /* PRELOADER */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--loader-bg);
      opacity: 1;
      visibility: visible;
      transition:
        opacity var(--loader-out) ease,
        visibility var(--loader-out) ease;
    }

    #preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-wrap {
      position: relative;
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      transform: scale(0.88);
      animation: loaderAppear 900ms ease forwards;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      animation: rotateRing 2.8s linear infinite;
    }

    .loader-segment {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 2px;
      border-radius: 999px;
      background: var(--loader-fg);
      transform-origin: -22px center;
      opacity: 0.16;
      animation: pulseSeg 1.08s ease-in-out infinite;
      will-change: transform, opacity;
    }

    .loader-center {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(255,255,255,0.20);
      animation: centerBreath 1.6s ease-in-out infinite;
    }

    .loader-segment:nth-child(1)  { transform: translate(-50%, -50%) rotate(0deg);   animation-delay: 0s; }
    .loader-segment:nth-child(2)  { transform: translate(-50%, -50%) rotate(30deg);  animation-delay: .08s; }
    .loader-segment:nth-child(3)  { transform: translate(-50%, -50%) rotate(60deg);  animation-delay: .16s; }
    .loader-segment:nth-child(4)  { transform: translate(-50%, -50%) rotate(90deg);  animation-delay: .24s; }
    .loader-segment:nth-child(5)  { transform: translate(-50%, -50%) rotate(120deg); animation-delay: .32s; }
    .loader-segment:nth-child(6)  { transform: translate(-50%, -50%) rotate(150deg); animation-delay: .40s; }
    .loader-segment:nth-child(7)  { transform: translate(-50%, -50%) rotate(180deg); animation-delay: .48s; }
    .loader-segment:nth-child(8)  { transform: translate(-50%, -50%) rotate(210deg); animation-delay: .56s; }
    .loader-segment:nth-child(9)  { transform: translate(-50%, -50%) rotate(240deg); animation-delay: .64s; }
    .loader-segment:nth-child(10) { transform: translate(-50%, -50%) rotate(270deg); animation-delay: .72s; }
    .loader-segment:nth-child(11) { transform: translate(-50%, -50%) rotate(300deg); animation-delay: .80s; }
    .loader-segment:nth-child(12) { transform: translate(-50%, -50%) rotate(330deg); animation-delay: .88s; }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes pulseSeg {
      0%, 100% {
        opacity: 0.12;
        filter: blur(0px);
      }
      50% {
        opacity: 1;
        filter: blur(0.2px);
      }
    }

    @keyframes centerBreath {
      0%, 100% {
        transform: scale(0.75);
        opacity: 0.6;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes loaderAppear {
      from {
        opacity: 0;
        transform: scale(0.72);
      }
      to {
        opacity: 1;
        transform: scale(0.88);
      }
    }

    @media (max-width: 768px) {
      .loader-wrap {
        width: 64px;
        height: 64px;
      }

      .loader-segment {
        width: 12px;
        transform-origin: -18px center;
      }

      .loader-center {
        width: 8px;
        height: 8px;
      }

      #door-wrapper {
        width: 300px;
        height: 440px;
      }
    }
  </style>
</head>
<body class="is-loading">

<div id="preloader" aria-hidden="true">
  <div class="loader-wrap">
    <div class="loader-ring">
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
      <span class="loader-segment"></span>
    </div>
    <div class="loader-center"></div>
  </div>
</div>

<div id="scroll-space"></div>

<div id="stage">
  <img id="seq-a" class="seq-layer active" alt="" decoding="async" fetchpriority="high">
  <img id="seq-b" class="seq-layer" alt="" decoding="async">
  <div id="fade-overlay"></div>

  <div id="door-scene">
    <div id="door-wrapper">
      <div id="door-tunnel">
        <div id="tunnel-inner"></div>
      </div>

      <svg id="door-svg" viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="360" height="520" fill="#000" />
        <rect x="20" y="20" width="320" height="480" fill="#f5f5f5" />
        <rect x="36" y="36" width="288" height="448" fill="#e9e9e9" />
        <rect x="180" y="36" width="2" height="448" fill="#d0d0d0" />

        <g id="door-left" style="transform-origin: 36px 260px; transform-box: fill-box;">
          <rect x="36" y="36" width="144" height="448" fill="#fdfdfd" />
          <rect x="48" y="52" width="120" height="416" fill="#f2f2f2" />
          <rect x="56" y="60" width="104" height="400" fill="#fdfdfd" />
          <rect x="160" y="246" width="8" height="32" rx="4" fill="#d0d0d0" />
        </g>

        <g id="door-right" style="transform-origin: 324px 260px; transform-box: fill-box;">
          <rect x="196" y="36" width="144" height="448" fill="#fdfdfd" />
          <rect x="208" y="52" width="120" height="416" fill="#f2f2f2" />
          <rect x="216" y="60" width="104" height="400" fill="#fdfdfd" />
          <rect x="196" y="246" width="8" height="32" rx="4" fill="#d0d0d0" />
        </g>

        <rect x="20" y="20" width="320" height="480" fill="none" stroke="#d0d0d0" stroke-width="2" />
      </svg>
    </div>
  </div>
</div>

<script>
  /* ───────────────── PRELOADER CONFIG ───────────────── */
  const MIN_LOADER_TIME = 1800;
  const MAX_LOADER_TIME = 7000;

  /* ───────────────── CONFIG ───────────────── */
  const FRAME_COUNT = 127; // compressed_002.jpg → compressed_128.jpg
  const PX_PER_FRAME = window.innerWidth <= 768 ? 30 : 24;
  const FADE_PX = 420;
  const DOOR_ZOOM_PX = 1200;
  const DOOR_OPEN_PX = 600;
  const TUNNEL_PX = 900;

  const S_SEQ_END  = (FRAME_COUNT - 1) * PX_PER_FRAME;
  const S_FADE_END = S_SEQ_END + FADE_PX;
  const S_ZOOM_END = S_FADE_END + DOOR_ZOOM_PX;
  const S_OPEN_END = S_ZOOM_END + DOOR_OPEN_PX;
  const S_TUNN_END = S_OPEN_END + TUNNEL_PX;
  const TOTAL_PX   = S_TUNN_END;

  const frameSrc = i => `img-sequence/compressed_${String(i + 2).padStart(3, '0')}.jpg`;

  /* ───────────────── DOM ───────────────── */
  const body = document.body;
  const preloader = document.getElementById('preloader');
  const scrollSpace = document.getElementById('scroll-space');
  const layerA = document.getElementById('seq-a');
  const layerB = document.getElementById('seq-b');
  const overlay = document.getElementById('fade-overlay');
  const doorScene = document.getElementById('door-scene');
  const doorWrapper = document.getElementById('door-wrapper');
  const doorLeft = document.getElementById('door-left');
  const doorRight = document.getElementById('door-right');
  const tunnelInner = document.getElementById('tunnel-inner');

  function setScrollHeight() {
    scrollSpace.style.height = (TOTAL_PX + window.innerHeight) + 'px';
  }
  setScrollHeight();

  /* ───────────────── TUNNEL ───────────────── */
  const WORDS = [
    { text: 'GABRJMAD', size: 130, x: 5,   y: 10, rot: -5  },
    { text: 'DESIGNER', size: 90,  x: 55,  y: 18, rot: 8   },
    { text: 'INVESTOR', size: 110, x: 10,  y: 40, rot: -8  },
    { text: 'BUISNESS', size: 100, x: 55,  y: 45, rot: 7   },
    { text: 'MODEL',    size: 140, x: 0,   y: 60, rot: -10 },
    { text: 'ROUND',    size: 95,  x: 60,  y: 68, rot: 6   },
    { text: 'FRONT',    size: 120, x: 8,   y: 78, rot: -7  },
    { text: 'BELLO',    size: 105, x: 58,  y: 82, rot: 9   },
    { text: 'GABRJMAD', size: 70,  x: -5,  y: 28, rot: 4   },
    { text: 'DESIGNER', size: 150, x: 25,  y: 52, rot: -4  },
  ];

  WORDS.forEach(w => {
    const el = document.createElement('div');
    el.className = 'tunnel-word';
    el.textContent = w.text;
    el.style.fontSize = w.size + 'px';
    el.style.left = w.x + '%';
    el.style.top = w.y + '%';
    el.style.transform = `rotate(${w.rot}deg)`;
    tunnelInner.appendChild(el);
  });

  /* ───────────────── HELPERS ───────────────── */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const norm = (v, a, b) => clamp((v - a) / (b - a), 0, 1);
  const ease = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

  function frameIndexFor(scrollY) {
    if (scrollY >= S_SEQ_END) return FRAME_COUNT - 1;
    const progress = clamp(scrollY / S_SEQ_END, 0, 1);
    return Math.round(progress * (FRAME_COUNT - 1));
  }

  /* ───────────────── FRAME CACHE ───────────────── */
  const frames = Array.from({ length: FRAME_COUNT }, () => ({
    status: 0,
    img: null,
    promise: null
  }));

  let activeLayer = layerA;
  let hiddenLayer = layerB;
  let shownFrame = -1;
  let wantedFrame = 0;

  function swapTo(src) {
    if (hiddenLayer.src !== src) hiddenLayer.src = src;
    hiddenLayer.classList.add('active');
    activeLayer.classList.remove('active');

    const tmp = activeLayer;
    activeLayer = hiddenLayer;
    hiddenLayer = tmp;
  }

  function ensureFrame(index, priority = 'auto') {
    if (index < 0 || index >= FRAME_COUNT) return Promise.resolve(null);

    const item = frames[index];
    if (item.status === 2) return Promise.resolve(item.img);
    if (item.promise) return item.promise;

    item.status = 1;

    const img = new Image();
    img.decoding = 'async';
    img.fetchPriority = priority;
    img.src = frameSrc(index);

    item.promise = new Promise((resolve, reject) => {
      img.onload = async () => {
        try {
          if (img.decode) await img.decode();
        } catch (e) {}

        item.status = 2;
        item.img = img;
        resolve(img);
      };

      img.onerror = () => {
        item.status = 3;
        reject(new Error(`Frame non trovato: ${frameSrc(index)}`));
      };
    }).finally(() => {
      item.promise = null;
      if (wantedFrame === index && frames[index].status === 2) {
        startLoop();
      }
    });

    return item.promise;
  }

  function warmFrames(center) {
    ensureFrame(center, 'high');
    ensureFrame(center + 1, 'high');
    ensureFrame(center - 1, 'high');
    ensureFrame(center + 2, 'auto');
    ensureFrame(center - 2, 'auto');
    ensureFrame(center + 3, 'auto');
    ensureFrame(center - 3, 'auto');
    ensureFrame(center + 4, 'auto');
    ensureFrame(center - 4, 'auto');
  }

  function showFrame(index) {
    index = clamp(index, 0, FRAME_COUNT - 1);
    wantedFrame = index;
    warmFrames(index);

    const item = frames[index];
    if (item.status !== 2 || !item.img) return;
    if (shownFrame === index) return;

    shownFrame = index;
    swapTo(item.img.currentSrc || item.img.src);
  }

  function preloadInitial() {
    for (let i = 0; i < Math.min(18, FRAME_COUNT); i++) {
      ensureFrame(i, 'high').catch(() => {});
    }

    let cursor = 18;

    function pump() {
      let count = 0;

      while (cursor < FRAME_COUNT && count < 4) {
        ensureFrame(cursor, 'auto').catch(() => {});
        cursor++;
        count++;
      }

      if (cursor < FRAME_COUNT) {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(pump, { timeout: 120 });
        } else {
          setTimeout(pump, 40);
        }
      }
    }

    setTimeout(pump, 80);
  }

  /* ───────────────── PRELOADER HELPERS ───────────────── */
  function waitForFonts() {
    if (!document.fonts || !document.fonts.ready) return Promise.resolve();
    return document.fonts.ready.catch(() => Promise.resolve());
  }

  function minDelay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function timeout(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function hidePreloader() {
    preloader.classList.add('is-hidden');
    body.classList.remove('is-loading');
    body.classList.add('is-ready');
  }

  /* ───────────────── SMOOTH RENDER LOOP ───────────────── */
  let targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  let currentScrollY = targetScrollY;
  let running = false;

  function render(scrollY) {
    const frameIdx = frameIndexFor(scrollY);
    showFrame(frameIdx);

    const fadeT = norm(scrollY, S_SEQ_END, S_FADE_END);
    overlay.style.opacity = fadeT.toFixed(3);

    if (scrollY < S_FADE_END) {
      doorScene.style.opacity = '0';
      return;
    }

    doorScene.style.opacity = '1';

    const zoomT = ease(norm(scrollY, S_FADE_END, S_TUNN_END));
    doorWrapper.style.transform = `scale(${(0.08 + zoomT * 3.2).toFixed(4)})`;

    const openT = ease(norm(scrollY, S_FADE_END, S_OPEN_END));
    doorLeft.style.transform  = `perspective(900px) rotateY(${(-85 * openT).toFixed(2)}deg)`;
    doorRight.style.transform = `perspective(900px) rotateY(${(85 * openT).toFixed(2)}deg)`;

    const tunnelT = ease(norm(scrollY, S_ZOOM_END, S_TUNN_END));
    tunnelInner.style.transform =
      `translateZ(${(-400 + 400 * tunnelT).toFixed(1)}px) rotateX(${(-20 - 70 * tunnelT).toFixed(2)}deg)`;
  }

  function loop() {
    const delta = targetScrollY - currentScrollY;

    if (Math.abs(delta) > 0.15) {
      currentScrollY += delta * 0.22;
    } else {
      currentScrollY = targetScrollY;
    }

    render(currentScrollY);

    const stillMoving = Math.abs(targetScrollY - currentScrollY) > 0.15;
    const waitingForFrame = frames[wantedFrame]?.status !== 2;

    if (stillMoving || waitingForFrame) {
      requestAnimationFrame(loop);
    } else {
      running = false;
      render(targetScrollY);
    }
  }

  function startLoop() {
    if (running) return;
    running = true;
    requestAnimationFrame(loop);
  }

  /* ───────────────── EVENTS ───────────────── */
  window.addEventListener('scroll', () => {
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    startLoop();
  }, { passive: true });

  window.addEventListener('resize', () => {
    setScrollHeight();
    targetScrollY = window.scrollY || document.documentElement.scrollTop || 0;
    currentScrollY = targetScrollY;
    startLoop();
  }, { passive: true });

  /* ───────────────── INIT ───────────────── */
  async function init() {
    preloadInitial();

    const firstFramePromise = ensureFrame(0, 'high')
      .then(img => {
        layerA.src = img.currentSrc || img.src;
        shownFrame = 0;
        wantedFrame = 0;
        render(currentScrollY);
      })
      .catch(() => {
        render(currentScrollY);
      });

    await Promise.race([
      Promise.all([
        firstFramePromise,
        waitForFonts(),
        minDelay(MIN_LOADER_TIME)
      ]),
      timeout(MAX_LOADER_TIME)
    ]);

    hidePreloader();
    startLoop();
  }

  window.addEventListener('load', init, { once: true });
</script>

</body>
</html>
